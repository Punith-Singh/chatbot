<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password | ChatBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #282843);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      color: #fff;
    }

    .background-blur {
      position: absolute;
      width: 250px;
      height: 250px;
      background: #7f5af0;
      filter: blur(120px);
      z-index: 0;
      top: 15%;
      left: 65%;
      opacity: 0.5;
    }

    .wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 1;
    }

    .messages-container {
      width: 100%;
      margin-bottom: 1rem;
      text-align: center;
      min-height: 50px;
    }

    .error-message, .success-message {
      border-radius: 12px;
      padding: 0.8rem;
      font-size: 0.95rem;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
      animation: fadeInSuccess 0.4s ease forwards;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
    }

    .error-message {
      color: #fca5a5;
      background: rgba(255, 0, 0, 0.1);
      border: 1px solid rgba(255, 0, 0, 0.2);
    }

    .success-message {
      color: #a6ffb4;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    
    .success-message .fa-solid {
        font-size: 1.5rem;
        animation: bounceIn 0.5s ease;
    }

    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes fadeInSuccess {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .phone-frame {
      width: 100%;
      max-width: 500px;
      height: auto;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 30px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(124, 58, 237, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.05);
      animation: glowPulse 3s ease-in-out infinite alternate;
    }
    
    @keyframes glowPulse {
        from { box-shadow: 0 0 50px rgba(124, 58, 237, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.05); }
        to { box-shadow: 0 0 70px rgba(124, 58, 237, 0.5), inset 0 0 12px rgba(255, 255, 255, 0.08); }
    }

    .card {
      background: transparent;
      padding: 2rem 1.5rem;
      color: #fff;
      animation: fadeIn 1s ease-out forwards;
      transform: translateY(30px);
      opacity: 0;
      text-align: center;
    }

    @keyframes fadeIn {
      to { transform: translateY(0); opacity: 1; }
    }

    .card h2 {
      margin-bottom: 1rem;
      font-size: 2rem;
      font-weight: 700;
    }
    
    .card p {
        color: #ddd;
        margin-bottom: 2rem;
    }

    .form-group {
      position: relative;
      margin-bottom: 1.8rem;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px 14px 48px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      transition: 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 2px #fff3;
    }

    .form-group label {
      position: absolute;
      top: 50%;
      left: 48px;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: #ccc;
      pointer-events: none;
      transition: 0.3s ease;
    }

    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: -12px;
      left: 10px;
      font-size: 0.75rem;
      color: #eee;
      background: #2a2a45;
      padding: 0 6px;
      border-radius: 4px;
    }

    .form-group .icon {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      font-size: 1.2rem;
      opacity: 0.8;
      color: #c4b5fd;
    }

    .action-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(145deg, #6d28d9, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .action-btn:hover:not(:disabled) {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    
    .action-btn:disabled {
        background: #58588e;
        cursor: not-allowed;
    }
    
    .action-btn .btn-text { transition: opacity 0.2s ease; }
    .action-btn.loading .btn-text { opacity: 0; }
    .action-btn .spinner {
        position: absolute; top: 50%; left: 50%;
        margin-left: -10px; margin-top: -10px;
        width: 20px; height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        opacity: 0;
        transition: opacity 0.2s ease;
    }
    .action-btn.loading .spinner { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .back-to-login {
      margin-top: 1.5rem;
      color: #ccc;
      font-size: 0.9rem;
    }

    .back-to-login a {
      color: #c4b5fd;
      text-decoration: none;
    }
    .back-to-login a:hover {
        text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="background-blur"></div>

  <div class="wrapper">
    <div class="messages-container">
      <div class="error-message" id="error-message"></div>
      <div class="success-message" id="success-message"></div>
    </div>

    <div class="phone-frame">
      <div class="card">
        <h2>Forgot Password</h2>
        <p>Enter your email and we'll send you a code to reset your password.</p>

        <div class="form-group">
          <i class="fa-solid fa-envelope icon"></i>
          <input type="email" id="email" placeholder=" " required />
          <label for="email">Your email address</label>
        </div>

        <button class="action-btn" id="send-code-btn">
            <span class="btn-text">Send Code</span>
            <div class="spinner"></div>
        </button>

        <div class="back-to-login">
          Remembered your password?
          <a href="login.html">Login here</a>
        </div>
      </div>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const emailInput = document.getElementById('email');
    const sendCodeBtn = document.getElementById('send-code-btn');
    const errorMsg = document.getElementById('error-message');
    const successMsg = document.getElementById('success-message');

    const sendResetCode = async () => {
      const email = emailInput.value.trim();

      errorMsg.style.display = 'none';
      successMsg.style.display = 'none';

      if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
        showError('Please enter a valid email address.');
        return;
      }
      
      setLoading(true);

      try {
        // This is a placeholder for your actual API call
        // const response = await fetch('http://localhost:5000/forgot-password', {
        //   method: 'POST',
        //   headers: { 'Content-Type': 'application/json' },
        //   body: JSON.stringify({ email }),
        // });
        // const data = await response.json();

        // MOCK API RESPONSE for demonstration
        await new Promise(resolve => setTimeout(resolve, 1500));
        const mockResponse = { ok: true }; 
        // const mockResponse = { ok: false, json: () => ({ message: "User not found." }) };
        
        if (mockResponse.ok) {
          showSuccess('Verification code sent! Please check your email.');
          setTimeout(() => {
            // Pass email to the next page to pre-fill it
            window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
          }, 2000);
        } else {
          const data = await mockResponse.json();
          showError(data.message || 'Failed to send reset code.');
          setLoading(false);
        }
      } catch (err) {
        showError('Server error. Please try again later.');
        setLoading(false);
        console.error("Forgot Password Error:", err);
      }
    };
    
    sendCodeBtn.addEventListener('click', sendResetCode);
    emailInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendResetCode();
        }
    });

    function showError(message) {
        errorMsg.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${message}`;
        errorMsg.style.display = 'flex';
    }

    function showSuccess(message) {
        successMsg.innerHTML = `<i class="fa-solid fa-paper-plane"></i> ${message}`;
        successMsg.style.display = 'flex';
    }

    function setLoading(isLoading) {
        sendCodeBtn.disabled = isLoading;
        sendCodeBtn.classList.toggle('loading', isLoading);
    }
});
</script>
</body>
</html>
