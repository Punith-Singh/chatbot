<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatBot Landing</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #282843);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      color: #fff;
    }

    .background-blur,
    .background-blur::before,
    .background-blur::after {
      position: absolute;
      content: "";
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #7f5af0, transparent 70%);
      filter: blur(120px);
      opacity: 0.4;
      animation: float 10s ease-in-out infinite alternate;
      z-index: 0;
    }

    .background-blur {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }

    .background-blur::before {
      top: 10%;
      left: 20%;
      animation-delay: 2s;
    }

    .background-blur::after {
      top: 60%;
      left: 70%;
      animation-delay: 4s;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-20px) scale(1.1); }
    }

    .phone-container {
      width: 100%;
      max-width: 500px;
      height: 667px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 30px;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      z-index: 1;
      color: #fff;
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 60px rgba(124, 58, 237, 0.4),
        0 0 20px rgba(124, 58, 237, 0.2),
        inset 0 0 10px rgba(255, 255, 255, 0.05);
      animation: glowPulse 3s ease-in-out infinite alternate;
    }
    
    @keyframes glowPulse {
        from { box-shadow: 0 0 50px rgba(124, 58, 237, 0.3), inset 0 0 10px rgba(255, 255, 255, 0.05); }
        to { box-shadow: 0 0 70px rgba(124, 58, 237, 0.5), inset 0 0 12px rgba(255, 255, 255, 0.08); }
    }

    .landing-card {
      background: transparent;
      padding: 2rem 1.5rem;
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Staggered animation for elements */
    .landing-card > * {
        opacity: 0;
        transform: translateY(20px);
        animation: fadeIn 0.8s ease-out forwards;
    }
    
    .landing-card #chatbot-icon { animation-delay: 0.2s; }
    .landing-card h1 { animation-delay: 0.4s; }
    .landing-card p { animation-delay: 0.6s; }
    .landing-card .btn-container { animation-delay: 0.8s; }


    @keyframes fadeIn {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
    
    #chatbot-icon {
        width: 150px;
        height: 150px;
        margin: 20px auto;
        border-radius: 20px;
        box-shadow: 0 0 20px rgba(127,90,240,0.4);
    }

    .landing-card h1 {
      font-size: 2.6rem;
      font-weight: 700;
      margin-bottom: 1rem;
      text-shadow: 0 2px 10px rgba(127, 90, 240, 0.5);
    }

    .landing-card p {
      font-size: 1.1rem;
      color: #ddd;
      margin-bottom: 2.5rem;
    }

    .btn-container {
      margin-top: auto;
    }

    .btn {
      display: inline-block;
      margin: 0 10px;
      padding: 14px 28px;
      border-radius: 15px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: all 0.4s ease;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }
    
    .btn-primary {
      background: linear-gradient(145deg, #6d28d9, #7c3aed);
      color: #fff;
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.3);
    }
    
    .btn-primary:hover {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 12px 35px rgba(124, 58, 237, 0.5);
    }
    
    .btn-secondary {
        background-color: transparent;
        color: #c4b5fd;
        border-color: #c4b5fd;
    }
    
    .btn-secondary:hover {
        background-color: rgba(196, 181, 253, 0.1);
        color: #fff;
        border-color: #fff;
        transform: translateY(-3px) scale(1.05);
        box-shadow: 0 8px 25px rgba(196, 181, 253, 0.2);
    }


    @media (max-width: 480px) {
      .phone-container {
        width: 100%;
        height: 100vh;
        border-radius: 0;
        padding: 1.5rem 1rem;
        box-shadow: none;
        animation: none;
      }

      .landing-card {
        padding: 1.5rem 1rem;
      }

      .landing-card h1 {
        font-size: 2.2rem;
      }

      .landing-card p {
        font-size: 1rem;
      }
      
      #chatbot-icon {
        width: 120px;
        height: 120px;
      }

      .btn {
        padding: 12px 22px;
        font-size: 0.9rem;
        margin: 0 5px;
      }
    }
  </style>
</head>
<body>
  <div class="background-blur"></div>

  <div class="phone-container">
    <div class="landing-card">
      <img src="favicon.png" alt="ChatBot Icon" id="chatbot-icon" />
      <h1>Welcome to ChatBot</h1>
      <p>Your smart, conversational AI assistant.</p>

      <div class="btn-container">
        <a href="login.html" class="btn btn-primary">Login</a>
        <a href="register.html" class="btn btn-secondary">Register</a>
      </div>
    </div>
  </div>
</body>
</html>
