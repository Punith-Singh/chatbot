<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password | ChatBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #282843);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    .background-blur {
      position: absolute;
      width: 250px;
      height: 250px;
      background: #7f5af0;
      filter: blur(120px);
      z-index: 0;
      top: 15%;
      left: 65%;
      opacity: 0.5;
    }

    .reset-password-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 1;
    }

    .messages-container {
      width: 100%;
      margin-bottom: 1rem;
      text-align: center;
    }

    .error-message, .success-message {
      padding: 0.8rem;
      font-size: 0.95rem;
      border-radius: 10px;
      display: none;
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.3s ease;
      transform: translateY(-10px);
    }

    .error-message.show, .success-message.show {
      display: flex;
      opacity: 1;
      transform: translateY(0);
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .error-message {
      background: rgba(255, 0, 0, 0.15);
      color: #f87171;
    }

    .success-message {
      background: rgba(34, 197, 94, 0.15);
      color: #a6ffb4;
      border: 1px solid rgba(34, 197, 94, 0.3);
      font-weight: 600;
    }

    .success-sticker {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .phone-frame {
      width: 500px;
      height: 575px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 30px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 2rem 1.5rem;
      z-index: 1;
      position: relative;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 60px rgba(124, 58, 237, 0.4),
        0 0 20px rgba(124, 58, 237, 0.2),
        inset 0 0 10px rgba(255, 255, 255, 0.05);
      animation: glowPulse 3s ease-in-out infinite alternate;
    }

    .reset-password-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .reset-password-card h2 {
      margin-bottom: 2rem;
      font-size: 2rem;
      font-weight: 700;
    }

    .form-group {
      position: relative;
      margin-bottom: 1.8rem;
      text-align: left;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px 14px 48px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
    }

    .form-group label {
      position: absolute;
      top: 50%;
      left: 48px;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: #ccc;
      pointer-events: none;
      transition: 0.3s ease;
    }

    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: -12px;
      left: 10px;
      font-size: 0.75rem;
      color: #eee;
      background: rgba(255, 255, 255, 0.15);
      padding: 0 6px;
      border-radius: 4px;
    }

    .icon.themed-icon {
      color: #c4b5fd;
      font-size: 1.2rem;
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      opacity: 0.9;
    }

    .toggle-password {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
      font-size: 0.85rem;
      color: #bbb;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .toggle-password.active {
      color: #a855f7;
    }

    .submit-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(145deg, #6d28d9, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
    }

    .submit-btn:hover {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="background-blur"></div>

  <div class="reset-password-wrapper">
    <div class="messages-container">
      <div class="error-message" id="error-message"></div>
      <div class="success-message" id="success-message"></div>
    </div>

    <div class="phone-frame">
      <div class="reset-password-card">
        <h2>Reset Password</h2>

        <div class="form-group">
          <i class="fa-solid fa-envelope icon themed-icon"></i>
          <input type="email" id="email" placeholder=" " required />
          <label for="email">Email</label>
        </div>

        <div class="form-group">
          <i class="fa-solid fa-key icon themed-icon"></i>
          <input type="text" id="code" placeholder=" " required />
          <label for="code">Verification Code</label>
        </div>

        <div class="form-group">
          <i class="fa-solid fa-lock icon themed-icon"></i>
          <input type="password" id="new-password" placeholder=" " required />
          <label for="new-password">New Password</label>
          <span id="togglePasswordNew" class="toggle-password" onclick="togglePassword('new-password', this)">Show</span>
        </div>

        <div class="form-group">
          <i class="fa-solid fa-lock icon themed-icon"></i>
          <input type="password" id="confirm-password" placeholder=" " required />
          <label for="confirm-password">Confirm Password</label>
          <span id="togglePasswordConfirm" class="toggle-password" onclick="togglePassword('confirm-password', this)">Show</span>
        </div>

        <button type="button" class="submit-btn" onclick="submitReset()">Reset Password</button>
      </div>
    </div>
  </div>

  <script>
    const emailField = document.getElementById("email");
    const codeField = document.getElementById("code");
    const newPasswordField = document.getElementById("new-password");
    const confirmPasswordField = document.getElementById("confirm-password");
    const errorMsg = document.getElementById("error-message");
    const successMsg = document.getElementById("success-message");

    function togglePassword(fieldId, toggleElement) {
      const field = document.getElementById(fieldId);
      const isShowing = field.type === "text";
      field.type = isShowing ? "password" : "text";
      toggleElement.textContent = isShowing ? "Show" : "Hide";
      toggleElement.classList.toggle("active", !isShowing);
    }

    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.add("show");
      successMsg.classList.remove("show");
    }

    function showSuccess(message) {
      successMsg.innerHTML = `<img src="https://cdn-icons-png.flaticon.com/512/190/190411.png" class="success-sticker" alt="Success" /> ${message}`;
      successMsg.classList.add("show");
      errorMsg.classList.remove("show");
    }

    function isEmailValid(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
   }


    [emailField, codeField, newPasswordField, confirmPasswordField].forEach((input) => {
      input.addEventListener("input", () => {
        errorMsg.classList.remove("show");
      });
    });

    async function submitReset() {
      const email = emailField.value.trim();
      const code = codeField.value.trim();
      const newPassword = newPasswordField.value.trim();
      const confirmPassword = confirmPasswordField.value.trim();

      if (!email || !code || !newPassword || !confirmPassword) {
        showError("All fields are required.");
        return;
      }

      if (!isEmailValid(email)) {
        showError("Invalid email format.");
        return;
      }

      if (newPassword !== confirmPassword) {
        showError("Passwords do not match.");
        return;
      }

      try {
        const response = await fetch("http://localhost:5000/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, code, new_password: newPassword }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
          showSuccess("Password successfully changed! Redirecting to login...");
          setTimeout(() => {
            window.location.href = "login.html";
          }, 3000);
        } else {
          showError(data.message || "Failed to reset password.");
        }
      } catch (error) {
        showError("Server error.");
      }
    }
  </script>
</body>
</html>
