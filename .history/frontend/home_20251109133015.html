<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChatBot | Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    
    .animate-delay-fade-in-up {
      animation: fadeInUp 0.7s ease-out 0.4s forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .inner-screen::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        100deg,
        rgba(255, 255, 255, 0) 20%,
        rgba(255, 255, 255, 0.05) 50%,
        rgba(255, 255, 255, 0) 80%
      );
      transform: skewX(-20deg);
      animation: shine 5s infinite linear 2s; 
      z-index: 1;
    }

    @keyframes shine {
      0% { left: -150%; }
      100% { left: 150%; }
    }

    .phone-frame {
      position: relative;
    }

    .phone-frame::before {
      content: '';
      position: absolute;
      top: -4px; 
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 60px; 
      padding: 4px;
      background: linear-gradient(60deg, #6366f1, #a855f7, #6366f1);
      background-size: 300% 300%;
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      filter: blur(8px);
      animation: rotateGlow 3s linear infinite;
      z-index: -1;
    }
    
    @keyframes rotateGlow {
      to { background-position: 300% 0; }
    }

    /* Hide scrollbar */
    .inner-screen, .chat-box {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    .inner-screen::-webkit-scrollbar,
    .chat-box::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }

    /* Input focus glow and shadow */
    .form-input {
      transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
      box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
    }
    .form-input:focus {
      border-color: #6366f1; /* indigo-500 */
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3);
      outline: none;
    }
    
    /* Message Fade-in */
    .message-animate {
        animation: messageFadeIn 0.3s ease-out forwards;
    }
    @keyframes messageFadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Dropdown Menu */
    .dropdown {
      position: relative;
      display: inline-block;
    }
    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      top: 100%; /* Position below the button */
      margin-top: 8px; /* Space from the button */
      background-color: #2c2c3e; /* Darker bg */
      min-width: 160px;
      box-shadow: 0 8px 16px 0 rgba(0,0,0,0.5);
      border: 1px solid #4a4a60;
      border-radius: 8px;
      z-index: 100;
      overflow: hidden;
      animation: fadeInMenu 0.2s ease-out;
    }
    .dropdown-content a, .dropdown-content button {
      color: #e0e0e0;
      padding: 12px 16px;
      text-decoration: none;
      display: flex; /* Use flex for icon alignment */
      align-items: center;
      gap: 10px; /* Space between icon and text */
      font-size: 14px;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      cursor: pointer;
    }
    .dropdown-content a:hover, .dropdown-content button:hover {
      background-color: #37374f;
      color: #ffffff;
    }
    .dropdown-content a:active, .dropdown-content button:active {
      background-color: #4f46e5; /* Indigo */
    }
    /* Red hover for logout */
    #logout-btn:hover {
        background-color: #5b21b6; /* More subtle red */
        color: #fecaca;
    }
    .dropdown.active .dropdown-content {
      display: block;
    }
    
    @keyframes fadeInMenu {
        from { opacity: 0; transform: translateY(-5px); }
        to { opacity: 1; transform: translateY(0); }
    }
    
    /* Copy button on message hover */
    .message-bot-container {
        position: relative;
    }
    .copy-btn {
        position: absolute;
        bottom: 8px; /* Position at the bottom of the message */
        right: -36px; /* Position outside the message bubble */
        opacity: 0;
        transition: opacity 0.2s ease-in-out;
        background: #374151; /* gray-700 */
        color: #d1d5db; /* gray-300 */
        border: none;
        border-radius: 50%;
        width: 28px;
        height: 28px;
        font-size: 12px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .message-bot-container:hover .copy-btn {
        opacity: 1;
    }
    .copy-btn:hover {
        background: #4b5563; /* gray-600 */
        color: white;
    }
    .copy-btn.copied {
        background: #22c55e; /* green-500 */
        color: white;
    }


  </style>
</head>
<body class="bg-gray-900 text-white">

  <div class="absolute -top-20 -left-20 w-72 h-72 bg-indigo-600/40 rounded-full filter blur-3xl opacity-50 animate-pulse"></div>
  <div class="absolute -bottom-20 -right-20 w-72 h-72 bg-purple-600/40 rounded-full filter blur-3xl opacity-50 animate-pulse" style="animation-delay: 2s;"></div>

  <div class="relative z-10 flex min-h-screen w-full items-center justify-center p-4">
    <div class="login-wrapper w-full max-w-md flex flex-col items-center">

      <div class="phone-frame animate-fade-in-up w-full max-w-sm rounded-[56px] border-8 border-gray-800 bg-gray-900 shadow-2xl shadow-indigo-500/10">
        <!-- **FIX**: Increased pb-8 for more "chin" -->
        <div class="inner-screen w-full h-[720px] rounded-[48px] bg-gray-950/70 relative overflow-y-auto backdrop-blur-[10px] flex flex-col pt-12 pb-8">
          
          <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-black rounded-b-2xl z-30"></div>
          
          <!-- Navbar -->
          <div class="navbar flex justify-between items-center mb-4 flex-shrink-0 z-30 px-6">
            <div class="logo flex items-center gap-2 text-xl font-bold text-white">
              <img 
                src=" 
                alt="ChatBot Icon" 
                class="w-8 h-8 rounded-lg"
                onerror="this.src='https://placehold.co/40x40/7c3aed/ffffff?text=AI'"
              />
              ChatBot
            </div>
            
            <!-- **NEW**: Three-dot Menu -->
            <div class="user-info flex items-center gap-2">
              <span id="username-display" class="text-sm text-gray-300 hidden sm:inline">Hi, Guest</span>
              
              <div class="dropdown" id="menu-dropdown">
                <button 
                  class="menu-toggle-btn rounded-full p-2 text-gray-400 hover:bg-gray-700 hover:text-white"
                  onclick="toggleMenu(event)">
                  <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10 3a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM10 8.5a1.5 1.5 0 110 3 1.5 1.5 0 010-3zM11.5 15.5a1.5 1.5 0 10-3 0 1.5 1.5 0 003 0z" />
                  </svg>
                </button>
                <div class="dropdown-content" id="menu-content">
                  <button onclick="clearChat()">
                    <i class="fa-solid fa-trash-can w-4 h-4 text-gray-400"></i>
                    Clear Chat
                  </button>
                  <button id="logout-btn" onclick="logout()">
                    <i class="fa-solid fa-arrow-right-from-bracket w-4 h-4 text-red-400"></i>
                    Logout
                  </button>
                </div>
              </div>

            </div>
          </div>

          <!-- Chat Box -->
          <div id="chat-box" class="chat-box flex-1 overflow-y-auto space-y-3 px-6 z-20 flex flex-col-reverse">
            <!-- Messages will be dynamically added here -->
            <div class="message-bot-container self-start max-w-[80%]">
              <div class="message-animate self-start bg-gray-800 border border-gray-700 text-white rounded-xl py-2 px-3.5 break-words">
                Hello! How can I assist you today?
              </div>
              <button class="copy-btn" onclick="copyToClipboard(this)">
                  <i class="fa-regular fa-copy"></i>
              </button>
            </div>
          </div>

          <!-- Chat Input -->
          <div class="chat-input-area flex gap-2 items-center flex-shrink-0 z-20 pt-4 px-6">
            <input 
              type="text" 
              id="user-message" 
              placeholder="Ask me anything..." 
              class="form-input flex-1 block w-full rounded-xl border border-gray-700 bg-gray-800 py-2.5 pl-4 pr-4 text-white placeholder-gray-400 transition-colors focus:bg-gray-700" 
            />
            <button 
              class="login-btn group relative flex-shrink-0 flex justify-center rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 p-2.5 text-base font-semibold text-white transition-all duration-200 ease-in-out hover:from-indigo-400 hover:to-purple-400 hover:scale-[1.03] hover:shadow-lg hover:shadow-indigo-500/40 active:scale-[.98] active:shadow-none" 
              onclick="sendMessage()">
              <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <path fill-rule="evenodd" d="M3.478 2.405a.75.75 0 00-.926.94l2.432 7.905H13.5a.75.75 0 010 1.5H4.984l-2.432 7.905a.75.75 0 00.926.94 60.519 60.519 0 0018.445-8.986.75.75 0 000-1.218A60.517 60.517 0 003.478 2.405z" clip-rule="evenodd" />
              </svg>
            </button>
          </div>
          
        </div>
      </div>

    </div>
  </div>

  <script>
    window.onload = () => {
      const userName = localStorage.getItem("chatbotUserName");
      const userEmail = localStorage.getItem("chatbotUserEmail");

      if (userName && userEmail) {
        // Display only the first name
        document.getElementById("username-display").textContent = `Hi, ${userName.split(' ')[0]}`; 
      } else {
        document.getElementById("username-display").textContent = "Hi, Guest";
      }

      // ENTER key triggers send
      document.getElementById("user-message").addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          sendMessage();
        }
      });
      
      // Auto-focus the input field on load
      document.getElementById("user-message").focus();
      
      // Close dropdown if clicking outside
      window.addEventListener('click', function(e) {
        const dropdown = document.getElementById('menu-dropdown');
        if (dropdown && !dropdown.contains(e.target)) {
          dropdown.classList.remove('active');
        }
      });
    };
    
    // **NEW**: Toggle menu
    function toggleMenu(event) {
        event.stopPropagation(); // Prevent window.onclick from closing it
        document.getElementById('menu-dropdown').classList.toggle('active');
    }
    
    // **NEW**: Clear Chat
    function clearChat() {
        const chatBox = document.getElementById("chat-box");
        chatBox.innerHTML = ''; // Clear all messages
        
        // Add back the default welcome message
        const welcomeMsgContainer = document.createElement('div');
        welcomeMsgContainer.className = 'message-bot-container self-start max-w-[80%]';
        
        const welcomeMsg = document.createElement('div');
        welcomeMsg.className = 'message-animate self-start bg-gray-800 border border-gray-700 text-white rounded-xl py-2 px-3.5 break-words';
        welcomeMsg.textContent = 'Hello! How can I assist you today?';
        
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.onclick = function() { copyToClipboard(this); };
        copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>';
        
        welcomeMsgContainer.appendChild(welcomeMsg);
        welcomeMsgContainer.appendChild(copyBtn);
        chatBox.appendChild(welcomeMsgContainer);
        
        document.getElementById('menu-dropdown').classList.remove('active'); // Close menu
    }
    
    // **NEW**: Copy to Clipboard
    function copyToClipboard(button) {
        const messageText = button.previousElementSibling.textContent;
        
        // Use document.execCommand for iFrame compatibility
        const textarea = document.createElement('textarea');
        textarea.value = messageText;
        document.body.appendChild(textarea);
        textarea.select();
        try {
            document.execCommand('copy');
            button.innerHTML = '<i class="fa-solid fa-check"></i>';
            button.classList.add('copied');
            setTimeout(() => {
                button.innerHTML = '<i class="fa-regular fa-copy"></i>';
                button.classList.remove('copied');
            }, 1500);
        } catch (err) {
            console.error('Failed to copy text: ', err);
            // Fallback or error handling here
        }
        document.body.removeChild(textarea);
    }

    function logout() {
      localStorage.removeItem("chatbotUserEmail");
      localStorage.removeItem("chatbotUserName");
      window.location.href = "login.html";
    }

    async function sendMessage() {
      const input = document.getElementById("user-message");
      const text = input.value.trim();
      if (!text) return;

      displayMessage(text, "user");
      const promptText = input.value; // Store value before clearing
      input.value = "";
      input.focus();

      // Show "Thinking..." message
      const chatBox = document.getElementById("chat-box");
      const thinkingMsg = document.createElement("div");
      
      thinkingMsg.className = 'message-bot-container self-start max-w-[80%]';
      thinkingMsg.innerHTML = `
        <div class="message-animate self-start bg-gray-800 border border-gray-700 text-white rounded-xl py-2 px-3.5 break-words">
            <span class="inline-block animate-bounce" style="animation-delay: 0s;">•</span>
            <span class="inline-block animate-bounce" style="animation-delay: 0.2s;">•</span>
            <span class="inline-block animate-bounce" style="animation-delay: 0.4s;">•</span>
        </div>
      `;
      
      chatBox.prepend(thinkingMsg);

      // Get response
      await getGeminiResponse(promptText);
    }

    function displayMessage(message, sender) {
      const box = document.getElementById("chat-box");
      
      if(sender === 'user') {
        const div = document.createElement("div");
        div.className = 'message-animate self-end bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-xl py-2 px-3.5 max-w-[80%] break-words';
        div.textContent = message;
        box.prepend(div);
      } else {
        // Bot message with container and copy button
        const container = document.createElement('div');
        container.className = 'message-bot-container self-start max-w-[80%]';
        
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message-animate self-start bg-gray-800 border border-gray-700 text-white rounded-xl py-2 px-3.5 break-words';
        messageDiv.textContent = message;
        
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.onclick = function() { copyToClipboard(this); };
        copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>';
        
        container.appendChild(messageDiv);
        container.appendChild(copyBtn);
        box.prepend(container);
      }
    }

    async function getGeminiResponse(promptText) {
      // Find and remove the "Thinking..." message
      const chatBox = document.getElementById("chat-box");
      const thinkingMsg = chatBox.firstChild; // Since we prepend, it's the first child
      
      try {
        const response = await fetch("http://localhost:5000/api/chatbot/gemini", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt: promptText })
        });

        if (!response.ok) {
            const errorData = await response.json();
            if (thinkingMsg && thinkingMsg.querySelector('.animate-bounce')) chatBox.removeChild(thinkingMsg);
            displayMessage(`⚠️ Error: ${errorData.message || response.statusText}`, 'bot');
            return; // Stop execution
        }

        const data = await response.json();
        const botResponse = data.response || "⚠️ Sorry, no response received.";
        
        if (thinkingMsg && thinkingMsg.querySelector('.animate-bounce')) chatBox.removeChild(thinkingMsg);
        displayMessage(botResponse, 'bot');

      } catch (error) {
        console.error("Error fetching from backend:", error);
        if (thinkingMsg && thinkingMsg.querySelector('.animate-bounce')) chatBox.removeChild(thinkingMsg);
        displayMessage("⚠️ Sorry, the chatbot service is unavailable.", 'bot');
      }
    }
  </script>
</body>
</html>
