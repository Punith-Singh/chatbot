<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatBot | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }
    html, body {
      width: 100%;
      overflow-x: hidden;
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #282843);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .background-blur {
      position: absolute;
      top: 10%;
      left: 70%;
      width: 300px;
      height: 300px;
      background: skyblue;
      filter: blur(150px);
      opacity: 0.4;
      z-index: 0;
    }
    .phone-frame {
      width: 500px;
      height: 667px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 30px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 2rem 1.5rem;
      z-index: 1;
      position: relative;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(25px);
      box-shadow:
        0 0 80px rgba(124, 58, 237, 0.4),
        inset 0 0 20px rgba(255, 255, 255, 0.04);
      animation: glowPulse 4s ease-in-out infinite alternate;
    }
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .logo svg {
      width: 28px;
      height: 28px;
    }
    .logout-btn {
      padding: 8px 16px;
      background: linear-gradient(145deg, #6d28d9, #7c3aed);
      border: none;
      border-radius: 12px;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .logout-btn:hover {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 15px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(20px);
      scroll-behavior: smooth;
    }
    .message {
      padding: 12px 16px;
      border-radius: 15px;
      max-width: 75%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in-out;
    }
    .message.user {
      align-self: flex-end;
      background: linear-gradient(to right, #6d28d9, #8b5cf6);
      color: #fff;
    }
    .message.bot {
      align-self: flex-start;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
    }
    .chat-input {
      display: flex;
      gap: 1rem;
    }
    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 1rem;
    }
    .chat-input input::placeholder {
      color: #bbb;
    }
    .chat-input input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 2px #fff3;
    }
    .chat-input button {
      padding: 12px 20px;
      background: linear-gradient(145deg, #6d28d9, #7c3aed);
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .chat-input button:hover {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    #username-display {
      font-weight: 500;
      margin-right: 10px;
    }
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes glowPulse {
      0% {
        box-shadow:
          0 0 60px rgba(124, 58, 237, 0.3),
          inset 0 0 20px rgba(255, 255, 255, 0.02);
      }
      100% {
        box-shadow:
          0 0 90px rgba(124, 58, 237, 0.5),
          inset 0 0 25px rgba(255, 255, 255, 0.04);
      }
    }
    @media (max-width: 600px) {
      .phone-frame {
        width: 95%;
        height: 95vh;
      }
      .chat-input {
        flex-direction: column;
      }
      .chat-input button {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="background-blur"></div>

  <div class="phone-frame">
    <div class="navbar">
      <div class="logo">
        <img src="favicon.png" alt="ChatBot Icon" style="width: 40px; height: 40px; border-radius: 12px;" />
        ChatBot
      </div>
      <div class="user-info">
        <span id="username-display">Hi, Guest</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="chat-box" id="chat-box"></div>

    <div class="chat-input">
      <input type="text" id="user-message" placeholder="Ask me anything..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    window.onload = () => {
      const userName = localStorage.getItem("chatbotUserName");
      const userEmail = localStorage.getItem("chatbotUserEmail");

      if (userName && userEmail) {
        document.getElementById("username-display").textContent = `Hi, ${userName}`;
      } else {
        document.getElementById("username-display").textContent = "Hi, Guest";
      }

      // ENTER key triggers send
      document.getElementById("user-message").addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          sendMessage();
        }
      });
    };

    function logout() {
      localStorage.removeItem("chatbotUserEmail");
      localStorage.removeItem("chatbotUserName");
      window.location.href = "login.html";
    }

    async function sendMessage() {
      const input = document.getElementById("user-message");
      const text = input.value.trim();
      if (!text) return;

      displayMessage(text, "user");
      input.value = "";

      // Show "Thinking..." message
      const chatBox = document.getElementById("chat-box");
      const thinkingMsg = document.createElement("div");
      thinkingMsg.classList.add("message", "bot");
      thinkingMsg.textContent = "Responding...";
      chatBox.appendChild(thinkingMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      // Get response
      const response = await getGeminiResponse(text);

      // Remove "Thinking..." message
      chatBox.removeChild(thinkingMsg);

      displayMessage(response, "bot");
    }

    function displayMessage(message, sender) {
      const box = document.getElementById("chat-box");
      const div = document.createElement("div");
      div.classList.add("message", sender);
      div.textContent = message;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function getGeminiResponse(promptText) {
      try {
        const response = await fetch("http://localhost:5000/api/chatbot/gemini", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ prompt: promptText })
        });

        const data = await response.json();
        return data.response || "⚠️ Sorry, no response received.";
      } catch (error) {
        console.error("Error fetching from backend:", error);
        return "⚠️ Sorry, the chatbot service is unavailable.";
      }
    }
  </script>
</body>
</html>
