<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | ChatBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    
    .animate-delay-fade-in-up {
      animation: fadeInUp 0.7s ease-out 0.4s forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-enter {
      animation: messageEnter 0.4s ease-out forwards;
    }

    @keyframes messageEnter {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .loading .btn-text {
      opacity: 0;
    }
    .loading .spinner {
      opacity: 1;
    }

    .inner-screen::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        100deg,
        rgba(255, 255, 255, 0) 20%,
        rgba(255, 255, 255, 0.05) 50%,
        rgba(255, 255, 255, 0) 80%
      );
      transform: skewX(-20deg);
      animation: shine 5s infinite linear 2s; 
      z-index: 1;
    }

    @keyframes shine {
      0% { left: -150%; }
      100% { left: 150%; }
    }

    .phone-frame {
      position: relative;
    }

    .phone-frame::before {
      content: '';
      position: absolute;
      top: -4px; 
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 60px; 
      padding: 4px;
      background: linear-gradient(60deg, #6366f1, #a855f7, #6366f1);
      background-size: 300% 300%;
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      /* Standard mask for compatibility with non-WebKit browsers */
      mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      filter: blur(8px);
      animation: rotateGlow 3s linear infinite;
      z-index: -1;
    }
    
    @keyframes rotateGlow {
      to { background-position: 300% 0; }
    }

    /* Hide scrollbar */
    .inner-screen {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    .inner-screen::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }

    /* Input focus glow and shadow */
    .form-input {
      transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
      box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.1);
    }
    .form-input:focus {
      border-color: #6366f1; /* indigo-500 */
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3), 0 2px 4px 0 rgba(0, 0, 0, 0.1);
      outline: none;
    }

  </style>
</head>
<body class="bg-gray-900 text-white">

  <div class="absolute -top-20 -left-20 w-72 h-72 bg-indigo-600/40 rounded-full filter blur-3xl opacity-50 animate-pulse"></div>
  <div class="absolute -bottom-20 -right-20 w-72 h-72 bg-purple-600/40 rounded-full filter blur-3xl opacity-50 animate-pulse" style="animation-delay: 2s;"></div>

  <div class="relative z-10 flex min-h-screen w-full items-center justify-center p-4">
    <div class="login-wrapper w-full max-w-md flex flex-col items-center">
      
      <!-- This message area is for global errors, not form errors -->
      <div class="messages-container w-full max-w-sm mb-4 min-h-[48px]">
        <!-- Global messages can go here if needed -->
      </div>

      <div class="phone-frame animate-fade-in-up w-full max-w-sm rounded-[56px] border-8 border-gray-800 bg-gray-900 shadow-2xl shadow-indigo-500/10">
        <div class="inner-screen w-full h-[720px] rounded-[48px] bg-gray-950/70 relative overflow-y-auto px-6 pt-12 pb-6 backdrop-blur-[10px]">
          
          <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-black rounded-b-2xl z-30"></div>
          
          <div class="login-content animate-delay-fade-in-up w-full flex flex-col relative z-20">
            <h2 class="mb-5 text-center text-3xl font-bold text-white">
              Forgot Password
            </h2>

            <form id="forgotForm" novalidate class="flex flex-col space-y-4">
              
              <!-- Form-specific error message -->
              <div id="error-message-form" class="hidden items-center justify-center gap-2 rounded-md border border-red-700 bg-red-900/50 p-2 text-sm font-medium text-red-300">
                <i class="fa-solid fa-circle-xmark"></i>
                <span class="message-text"></span>
              </div>
              <!-- Form-specific success message -->
              <div id="success-message-form" class="hidden items-center justify-center gap-2 rounded-md border border-green-700 bg-green-900/50 p-2 text-sm font-medium text-green-300">
                <i class="fa-solid fa-paper-plane"></i>
                <span class="message-text"></span>
              </div>
              
              <p class="text-sm text-center text-gray-300">
                Enter your email and we'll send you a code to reset your password.
              </p>

              <!-- Email -->
              <div class="relative pt-2">
                <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5 pt-2">
                  <i class="fa-solid fa-envelope h-5 w-5 text-gray-300"></i>
                </div>
                <input
                  type="email"
                  id="email"
                  class="form-input block w-full rounded-md border border-gray-700 bg-gray-800 py-3 pl-11 pr-4 text-white placeholder-gray-300 transition-colors focus:bg-gray-700"
                  placeholder="Email"
                  required
                />
              </div>

              <!-- Submit Button -->
              <!-- **FIX**: Removed hover:scale-[1.03] and active:scale-[.98] -->
              <button class="login-btn group relative flex w-full justify-center rounded-md bg-gradient-to-r from-indigo-500 to-purple-500 px-4 py-2.5 text-base font-semibold text-white transition-all duration-200 ease-in-out hover:from-indigo-400 hover:to-purple-400 hover:shadow-lg hover:shadow-indigo-500/40 active:shadow-none disabled:bg-gray-600 disabled:from-gray-600 disabled:to-gray-700 disabled:cursor-not-allowed disabled:hover:scale-100 disabled:hover:shadow-none" id="send-code-btn">
                <span class="btn-text transition-opacity duration-200">Send Code</span>
                <div class="spinner absolute left-1/2 top-1/2 h-5 w-5 -translate-x-1/2 -translate-y-1/2 animate-spin rounded-full border-2 border-white/30 border-t-white opacity-0 transition-opacity duration-200"></div>
              </button>

            </form>

            <div class="pt-5 text-center text-sm text-gray-300">
              Remembered your password?
              <a href="login.html" class="font-medium text-indigo-400 hover:text-indigo-200 hover:underline">
                Login here
              </a>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const emailInput = document.getElementById('email');
    const sendCodeBtn = document.getElementById('send-code-btn');
    const form = document.getElementById('forgotForm');
    const errorMsg = document.getElementById('error-message-form');
    const successMsg = document.getElementById('success-message-form');

    const sendResetCode = async () => {
        const email = emailInput.value.trim();

        hideMessages();

        if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
            showMessage(errorMsg, 'Please enter a valid email address.');
            return;
        }
        
        setLoading(true);

        try {
            // **FIX**: Using the real API call, removed mock data
            const response = await fetch('http://localhost:5000/forgot-password', {
             method: 'POST',
             headers: { 'Content-Type': 'application/json' },
             body: JSON.stringify({ email }),
            });
            
            const data = await response.json();
            
            if (response.ok) {
                showMessage(successMsg, 'Verification code sent! Please check your email.');
                setTimeout(() => {
                    // Pass email to the next page to pre-fill it
                    window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
                }, 2000);
            } else {
                showMessage(errorMsg, data.message || 'Failed to send reset code.');
                setLoading(false);
            }
        } catch (err) {
            showMessage(errorMsg, 'Server error. Please try again later.');
            setLoading(false);
            console.error("Forgot Password Error:", err);
        }
    };
    
    form.addEventListener('submit', (e) => {
        e.preventDefault();
        sendResetCode();
    });
    
    emailInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            e.preventDefault();
            sendResetCode();
        }
    });

    function showMessage(element, text) {
        hideMessages();
        const textElement = element.querySelector('.message-text') || element;
        textElement.textContent = text;
        element.classList.remove("hidden");
        element.classList.add("flex", "message-enter");
        setTimeout(() => element.classList.remove("message-enter"), 400);
    }
    
    function hideMessages() {
        errorMsg.classList.add("hidden");
        errorMsg.classList.remove("flex", "message-enter");
        successMsg.classList.add("hidden");
        successMsg.classList.remove("flex", "message-enter");
    }

    function setLoading(isLoading) {
        sendCodeBtn.disabled = isLoading;
        sendCodeBtn.classList.toggle('loading', isLoading);
    }
});
</script>
</body>
</html>
