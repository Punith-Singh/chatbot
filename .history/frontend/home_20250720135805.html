<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ChatBot | Home</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* Basic reset and font import */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    /* Body styling for background and centering content */
    html, body {
      width: 100%;
      overflow-x: hidden; /* Prevent horizontal scroll */
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #282843);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Background blur elements for visual effect */
    .background-blur {
      position: absolute;
      top: 10%;
      left: 70%;
      width: 300px;
      height: 300px;
      background: #7f5af0;
      filter: blur(150px);
      opacity: 0.4;
      z-index: 0;
    }

    /* Phone frame container styling */
    .phone-frame {
      width: 500px;
      height: 667px; /* Fixed height for consistent phone-like appearance */
      background: rgba(255, 255, 255, 0.06);
      border-radius: 30px;
      overflow: hidden; /* Hide overflow content */
      display: flex;
      flex-direction: column;
      padding: 2rem 1.5rem;
      z-index: 1;
      position: relative;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(25px);
      box-shadow:
        0 0 80px rgba(124, 58, 237, 0.4),
        inset 0 0 20px rgba(255, 255, 255, 0.04);
      animation: glowPulse 4s ease-in-out infinite alternate; /* Pulsing glow effect */
    }

    /* Navbar styling */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    /* Logo styling */
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Logo SVG styling */
    .logo svg {
      width: 28px;
      height: 28px;
      fill: #fff; /* Color the SVG to match text */
    }

    /* Logout button styling */
    .logout-btn {
      padding: 8px 16px;
      background: linear-gradient(145deg, #6d28d9, #7c3aed);
      border: none;
      border-radius: 12px;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    /* Chat box container */
    .chat-box {
      flex: 1; /* Takes up remaining vertical space */
      overflow-y: auto; /* Enable scrolling for chat messages */
      display: flex;
      flex-direction: column;
      gap: 1rem;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 15px;
      padding: 1rem;
      margin-bottom: 1.5rem;
      backdrop-filter: blur(20px);
      scroll-behavior: smooth; /* Smooth scrolling for new messages */
    }

    /* Individual message styling */
    .message {
      padding: 12px 16px;
      border-radius: 15px;
      max-width: 75%;
      word-wrap: break-word;
      animation: fadeIn 0.3s ease-in-out;
    }

    /* User message specific styling */
    .message.user {
      align-self: flex-end; /* Align to the right */
      background: linear-gradient(to right, #6d28d9, #8b5cf6);
      color: #fff;
    }

    /* Bot message specific styling */
    .message.bot {
      align-self: flex-start; /* Align to the left */
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #e0e0e0;
    }

    /* Chat input area styling */
    .chat-input {
      display: flex;
      gap: 1rem;
    }

    /* Chat input field styling */
    .chat-input input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 12px;
      border: none;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      font-size: 1rem;
      outline: none;
    }

    .chat-input input::placeholder {
      color: #bbb;
    }

    .chat-input input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 2px #fff3;
    }

    /* Send button styling */
    .chat-input button {
      padding: 12px 20px;
      background: linear-gradient(145deg, #6d28d9, #7c3aed);
      border: none;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex; /* For centering loading spinner */
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .chat-input button:hover:not(:disabled) {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .chat-input button:disabled {
      background: linear-gradient(145deg, #4a1e8a, #5c2ea0); /* Darker for disabled state */
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* Loading spinner animation */
    .loading-spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Username display styling */
    #username-display {
      font-weight: 500;
      margin-right: 10px;
    }

    /* Keyframe animation for message fade in */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Keyframe animation for phone frame glow pulse */
    @keyframes glowPulse {
      0% {
        box-shadow:
          0 0 60px rgba(124, 58, 237, 0.3),
          inset 0 0 20px rgba(255, 255, 255, 0.02);
      }
      100% {
        box-shadow:
          0 0 90px rgba(124, 58, 237, 0.5),
          inset 0 0 25px rgba(255, 255, 255, 0.04);
      }
    }

    /* Media queries for responsiveness */
    @media (max-width: 600px) {
      .phone-frame {
        width: 95%; /* Adjust width for smaller screens */
        height: 95vh; /* Use viewport height for smaller screens */
        padding: 1.5rem 1rem;
        border-radius: 20px;
      }
      .navbar {
        flex-direction: column;
        gap: 1rem;
        margin-bottom: 1rem;
      }
      .user-info {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }
      #username-display {
        margin-right: 0;
        margin-bottom: 0.5rem;
      }
      .chat-input {
        flex-direction: column; /* Stack input and button vertically */
      }
      .chat-input button {
        width: 100%; /* Full width button */
      }
      .message {
        max-width: 90%; /* Allow messages to take more width */
      }
    }
  </style>
</head>
<body>

  <div class="background-blur"></div>

  <div class="phone-frame">
    <div class="navbar">
      <div class="logo">
        <!-- Inline SVG for ChatBot Icon -->
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM15.5 10.5C16.3284 10.5 17 9.82843 17 9C17 8.17157 16.3284 7.5 15.5 7.5C14.6716 7.5 14 8.17157 14 9C14 9.82843 14.6716 10.5 15.5 10.5ZM8.5 10.5C9.32843 10.5 10 9.82843 10 9C10 8.17157 9.32843 7.5 8.5 7.5C7.67157 7.5 7 8.17157 7 9C7 9.82843 7.67157 10.5 8.5 10.5ZM12 18C9.5 18 7.5 16.5 7.5 16.5H16.5C16.5 16.5 14.5 18 12 18Z" fill="currentColor"/>
        </svg>
        ChatBot
      </div>
      <div class="user-info">
        <span id="username-display" aria-live="polite">Hi, Guest</span>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <div class="chat-box" id="chat-box" role="log" aria-live="polite" aria-atomic="false"></div>

    <div class="chat-input">
      <input type="text" id="user-message" placeholder="Ask me anything..." aria-label="Type your message" />
      <button onclick="sendMessage()" id="send-button">
        <span id="send-button-text">Send</span>
        <div id="send-loading-spinner" class="loading-spinner" style="display: none;"></div>
      </button>
    </div>
  </div>

  <script type="module">
    // Get references to DOM elements
    const usernameDisplay = document.getElementById("username-display");
    const chatBox = document.getElementById("chat-box");
    const userMessageInput = document.getElementById("user-message");
    const sendButton = document.getElementById("send-button");
    const sendButtonText = document.getElementById("send-button-text");
    const sendLoadingSpinner = document.getElementById("send-loading-spinner");

    // Initialize chat history from local storage or an empty array
    let chatHistory = JSON.parse(localStorage.getItem("chatHistory")) || [];

    // Global variable for API key (Canvas will provide this at runtime)
    const apiKey = ""; // Leave this empty for Canvas environment

    /**
     * Initializes the application on window load.
     * Sets username and loads chat history.
     */
    window.onload = () => {
      const userName = localStorage.getItem("chatbotUserName");
      const userEmail = localStorage.getItem("chatbotUserEmail");

      if (userName && userEmail) {
        usernameDisplay.textContent = `Hi, ${userName}`;
      } else {
        usernameDisplay.textContent = "Hi, Guest";
      }

      // Display existing chat history
      chatHistory.forEach(message => {
        displayMessage(message.text, message.sender, false); // Do not save again
      });
      chatBox.scrollTop = chatBox.scrollHeight; // Scroll to bottom
    };

    /**
     * Logs out the user by clearing local storage and redirecting.
     */
    function logout() {
      localStorage.removeItem("chatbotUserEmail");
      localStorage.removeItem("chatbotUserName");
      localStorage.removeItem("chatHistory"); // Clear chat history on logout
      window.location.href = "login.html";
    }

    /**
     * Sends a message from the user and gets a response from Gemini.
     */
    async function sendMessage() {
      const text = userMessageInput.value.trim();
      if (!text) return;

      // Display user message
      displayMessage(text, "user");
      userMessageInput.value = "";
      userMessageInput.disabled = true; // Disable input while waiting for response
      sendButton.disabled = true; // Disable send button
      sendButtonText.textContent = "Sending...";
      sendLoadingSpinner.style.display = "block";

      try {
        const botResponse = await getGeminiResponse(text);
        displayMessage(botResponse, "bot");
      } catch (error) {
        console.error("Error sending message:", error);
        displayMessage("⚠️ Sorry, I couldn't get a response right now. Please try again.", "bot");
      } finally {
        userMessageInput.disabled = false; // Re-enable input
        sendButton.disabled = false; // Re-enable send button
        sendButtonText.textContent = "Send";
        sendLoadingSpinner.style.display = "none";
        userMessageInput.focus(); // Focus input for next message
      }
    }

    /**
     * Displays a message in the chat box and optionally saves it to history.
     * @param {string} message - The message text.
     * @param {string} sender - 'user' or 'bot'.
     * @param {boolean} [save=true] - Whether to save the message to chat history.
     */
    function displayMessage(message, sender, save = true) {
      const div = document.createElement("div");
      div.classList.add("message", sender);
      div.textContent = message;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight; // Scroll to the latest message

      if (save) {
        chatHistory.push({ text: message, sender: sender });
        localStorage.setItem("chatHistory", JSON.stringify(chatHistory));
      }
    }

    /**
     * Fetches a response from the Gemini model using the Google Generative Language API.
     * @param {string} promptText - The user's message to send to the chatbot.
     * @returns {Promise<string>} The chatbot's response.
     */
    async function getGeminiResponse(promptText) {
      // Add the user's current prompt to the chat history for context
      const currentChatHistory = chatHistory.map(msg => ({
        role: msg.sender === 'user' ? 'user' : 'model', // Gemini API uses 'user' and 'model' roles
        parts: [{ text: msg.text }]
      }));

      // Add the latest user prompt to the history for the current request
      currentChatHistory.push({ role: "user", parts: [{ text: promptText }] });

      const payload = { contents: currentChatHistory };
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`;

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const errorData = await response.json();
          console.error("Gemini API error:", errorData);
          throw new Error(`API error: ${errorData.error.message || response.statusText}`);
        }

        const result = await response.json();

        if (result.candidates && result.candidates.length > 0 &&
            result.candidates[0].content && result.candidates[0].content.parts &&
            result.candidates[0].content.parts.length > 0) {
          return result.candidates[0].content.parts[0].text;
        } else {
          return "⚠️ Sorry, I couldn't generate a meaningful response.";
        }
      } catch (error) {
        console.error("Error calling Gemini API:", error);
        return `⚠️ Error: ${error.message || "Could not connect to the chatbot service."}`;
      }
    }

    // Event listener for Enter key in the input field
    userMessageInput.addEventListener("keypress", (event) => {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>
</body>
</html>
