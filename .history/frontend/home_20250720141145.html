<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      width: 100%;
      max-width: 400px;
      height: 90vh;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 30px rgba(0,0,0,0.3);
    }

    .chat-header {
      padding: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.05);
      font-weight: 700;
      font-size: 1.2rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    .chat-box {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message {
      max-width: 80%;
      padding: 10px 15px;
      border-radius: 15px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .message.user {
      align-self: flex-end;
      background: #4e54c8;
      color: #fff;
    }

    .message.bot {
      align-self: flex-start;
      background: #00c9a7;
      color: #000;
    }

    .chat-input {
      display: flex;
      padding: 15px;
      background: rgba(255, 255, 255, 0.05);
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    .chat-input input {
      flex: 1;
      padding: 10px 15px;
      border: none;
      border-radius: 10px;
      outline: none;
      font-size: 1rem;
    }

    .chat-input button {
      margin-left: 10px;
      padding: 10px 15px;
      background-color: #4e54c8;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    .chat-input button:hover {
      background-color: #3c40a2;
    }

    /* Typing animation */
    .typing {
      display: inline-block;
      font-size: 1.2rem;
    }

    .typing span {
      display: inline-block;
      animation: blink 1.4s infinite both;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0% { opacity: 0.2; }
      20% { opacity: 1; }
      100% { opacity: 0.2; }
    }

    @media (max-width: 600px) {
      .chat-container {
        max-width: 100%;
        height: 100vh;
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">ChatBot 🤖</div>
    <div class="chat-box" id="chat-box"></div>
    <div class="chat-input">
      <input type="text" id="user-message" placeholder="Type a message..." />
      <button onclick="sendMessage()">Send</button>
    </div>
  </div>

  <script>
    async function getGeminiResponse(prompt) {
      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt }),
        });
        const data = await response.json();
        return data.response || "Sorry, I didn’t understand that.";
      } catch (error) {
        console.error("Error:", error);
        return "⚠️ Error connecting to server.";
      }
    }

    function displayMessage(message, sender) {
      const chatBox = document.getElementById("chat-box");
      const msg = document.createElement("div");
      msg.className = `message ${sender}`;
      msg.textContent = message;
      chatBox.appendChild(msg);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
      const input = document.getElementById("user-message");
      const sendButton = document.querySelector(".chat-input button");
      const text = input.value.trim();
      if (!text) return;

      sendButton.disabled = true;
      sendButton.style.opacity = 0.6;
      input.disabled = true;

      displayMessage(text, "user");
      input.value = "";

      const chatBox = document.getElementById("chat-box");
      const thinkingMsg = document.createElement("div");
      thinkingMsg.classList.add("message", "bot");
      thinkingMsg.innerHTML = '<span class="typing"><span>.</span><span>.</span><span>.</span></span>';
      chatBox.appendChild(thinkingMsg);
      chatBox.scrollTop = chatBox.scrollHeight;

      const response = await getGeminiResponse(text);

      chatBox.removeChild(thinkingMsg);
      displayMessage(response, "bot");

      sendButton.disabled = false;
      sendButton.style.opacity = 1;
      input.disabled = false;
      input.focus();
    }

    // Send on Enter key
    document.getElementById("user-message").addEventListener("keydown", function (e) {
      if (e.key === "Enter") {
        sendMessage();
      }
    });

    // Welcome message on load
    window.onload = () => {
      displayMessage("👋 Hi! I'm your AI assistant. Ask me anything!", "bot");
      document.getElementById("user-message").focus();
    };
  </script>
</body>
</html>
