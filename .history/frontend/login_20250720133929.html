<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | ChatBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700;900&display=swap" rel="stylesheet">
  <style>
    /* Base Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif; /* Changed to Inter as per guidelines */
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #282843); /* Dark gradient background */
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* Hide overflow from background elements */
      position: relative;
      transition: all 0.5s ease;
    }

    /* Background Animation for smoother transitions */
    body.fade-out {
      animation: fadeOut 0.8s ease forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: scale(0.98);
      }
    }

    /* Decorative Background Blur Elements */
    .background-blur {
      position: absolute;
      width: 250px;
      height: 250px;
      background: #7f5af0; /* Purple glow */
      filter: blur(120px);
      z-index: 0;
      top: 15%;
      left: 65%;
      opacity: 0.5;
      border-radius: 50%; /* Ensure it's circular */
      animation: moveBlur1 20s ease-in-out infinite alternate;
    }

    .background-blur::before {
      content: '';
      position: absolute;
      width: 200px;
      height: 200px;
      background: #00bcd4; /* Cyan glow */
      filter: blur(100px);
      z-index: 0;
      bottom: 10%;
      right: 70%;
      opacity: 0.4;
      border-radius: 50%;
      animation: moveBlur2 25s ease-in-out infinite alternate-reverse;
    }

    @keyframes moveBlur1 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-50px, 80px) scale(1.1); }
      100% { transform: translate(0, 0) scale(1); }
    }

    @keyframes moveBlur2 {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, -90px) scale(1.05); }
      100% { transform: translate(0, 0) scale(1); }
    }

    /* Main Login Wrapper */
    .login-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px; /* Max width for the entire wrapper */
      position: relative;
      z-index: 1; /* Ensure it's above background elements */
      padding: 0 20px; /* Add horizontal padding for smaller screens */
    }

    /* Message Containers */
    .messages-container {
      width: 100%;
      margin-bottom: 1.5rem; /* Increased margin */
      text-align: center;
      min-height: 40px; /* Ensure space even when no message */
    }

    .error-message {
      color: #fca5a5; /* Light red */
      background: rgba(255, 0, 0, 0.15); /* Slightly more opaque */
      border-radius: 10px; /* More rounded */
      padding: 0.8rem 1rem; /* More padding */
      font-size: 0.95rem; /* Slightly larger font */
      font-weight: 500;
      display: none;
      box-shadow: 0 2px 10px rgba(255, 0, 0, 0.2);
    }

    .success-message {
      color: #a6ffb4; /* Light green */
      background: rgba(34, 197, 94, 0.2); /* Slightly more opaque */
      border: 1px solid rgba(34, 197, 94, 0.4); /* Stronger border */
      border-radius: 15px; /* More rounded */
      padding: 1rem 1.2rem; /* More padding */
      font-size: 1rem; /* Larger font */
      font-weight: 600;
      text-align: center;
      backdrop-filter: blur(12px); /* Stronger blur */
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3); /* More prominent shadow */
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px; /* More space between icon and text */
      animation: fadeInSuccess 0.5s ease forwards;
    }

    /* Success Sticker (SVG) */
    .success-sticker {
      width: 30px; /* Adjusted size for SVG */
      height: 30px;
      animation: bounceIn 0.6s ease;
      flex-shrink: 0; /* Prevent shrinking */
    }

    @keyframes bounceIn {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    @keyframes fadeInSuccess {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Phone Frame (Outer container for the card, optional but nice for visual flair) */
    .phone-frame {
      width: 100%;
      max-width: 480px; /* Adjusted max-width */
      min-height: 600px; /* Minimum height for better appearance */
      background: rgba(255, 255, 255, 0.03); /* Very subtle translucent background */
      border-radius: 40px; /* More rounded frame */
      overflow: hidden; /* Hide content overflow */
      padding: 2.5rem 2rem; /* Increased padding */
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      color: #fff;
      box-shadow:
        0 0 80px rgba(124, 58, 237, 0.5), /* Stronger glow */
        0 0 30px rgba(124, 58, 237, 0.3),
        inset 0 0 15px rgba(255, 255, 255, 0.08); /* More prominent inner glow */
      border: 1px solid rgba(255, 255, 255, 0.08); /* Stronger border */
      backdrop-filter: blur(30px) saturate(180%); /* Stronger glass effect */
      animation: glowPulse 4s ease-in-out infinite alternate; /* Slower, smoother pulse */
    }

    @keyframes glowPulse {
      0% { box-shadow: 0 0 80px rgba(124, 58, 237, 0.5), 0 0 30px rgba(124, 58, 237, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.08); }
      100% { box-shadow: 0 0 90px rgba(124, 58, 237, 0.6), 0 0 40px rgba(124, 58, 237, 0.4), inset 0 0 20px rgba(255, 255, 255, 0.1); }
    }

    /* Login Card (Inner form container) */
    .login-card {
      background: rgba(255, 255, 255, 0.09); /* Slightly more opaque than frame */
      backdrop-filter: blur(25px) saturate(200%); /* Stronger blur for card */
      border-radius: 25px; /* More rounded */
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.6); /* Deeper shadow */
      padding: 2.5rem 2rem; /* Increased padding */
      color: #fff;
      animation: fadeIn 1s ease-out forwards;
      transform: translateY(30px);
      opacity: 0;
      border: 1px solid rgba(255, 255, 255, 0.1); /* Subtle border */
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 2.5rem; /* More space below heading */
      font-size: 2.2rem; /* Larger heading */
      font-weight: 900; /* Bolder */
      letter-spacing: 1.5px; /* More spacing */
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.4); /* Deeper text shadow */
    }

    /* Form Groups (Input fields) */
    .form-group {
      position: relative;
      margin-bottom: 2rem; /* More space between fields */
    }

    .form-group input {
      width: 100%;
      padding: 16px 20px 16px 55px; /* More padding, adjusted left for icon */
      border: none;
      border-radius: 15px; /* More rounded */
      background: rgba(255, 255, 255, 0.12); /* Slightly more opaque input */
      color: #fff;
      font-size: 1.1rem; /* Larger font */
      transition: all 0.3s ease;
      font-weight: 500;
    }

    .form-group input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2); /* Lighter on focus */
      box-shadow: 0 0 0 3px #7f5af0; /* Purple glow on focus */
    }

    .form-group label {
      position: absolute;
      top: 50%;
      left: 55px; /* Adjusted left for icon */
      transform: translateY(-50%);
      font-size: 1rem; /* Larger label font */
      color: #ccc;
      pointer-events: none;
      transition: all 0.3s ease;
      font-weight: 500;
    }

    /* Label animation when input is focused or has content */
    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: -14px; /* Move label higher */
      left: 15px; /* Move label left */
      font-size: 0.8rem; /* Smaller font when moved */
      color: #eee;
      background: rgba(255, 255, 255, 0.2); /* Background for label */
      padding: 2px 8px; /* Padding for label background */
      border-radius: 6px; /* Rounded label background */
      font-weight: 600;
    }

    /* Input Icons (SVG) */
    .form-group .icon {
      position: absolute;
      top: 50%;
      left: 18px; /* Adjusted left position */
      transform: translateY(-50%);
      font-size: 1.4rem; /* Larger icon size */
      opacity: 0.9;
      color: #c4b5fd; /* Consistent purple color */
      width: 24px; /* Explicit width for SVG */
      height: 24px; /* Explicit height for SVG */
    }

    /* Checkbox Group */
    .checkbox-group {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem; /* Slightly larger */
      margin-bottom: 2rem; /* More space */
      color: #ddd;
      align-items: center;
    }

    .checkbox-group a {
      color: #c4b5fd;
      text-decoration: none;
      transition: color 0.3s ease;
    }

    .checkbox-group a:hover {
      color: #a78bfa; /* Lighter purple on hover */
      text-decoration: underline;
    }

    .checkbox-group input[type="checkbox"] {
      margin-right: 8px; /* More space */
      width: 18px; /* Larger checkbox */
      height: 18px;
      accent-color: #7f5af0; /* Custom color for checkbox */
      cursor: pointer;
    }

    /* Login Button */
    .login-btn {
      width: 100%;
      padding: 16px; /* Increased padding */
      background: linear-gradient(145deg, #6d28d9, #7c3aed); /* Purple gradient */
      color: #fff;
      border: none;
      border-radius: 15px; /* More rounded */
      font-size: 1.15rem; /* Larger font */
      font-weight: 700; /* Bolder */
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4); /* Deeper shadow */
    }

    .login-btn:hover {
      background: linear-gradient(145deg, #8b5cf6, #7f5af0); /* Lighter gradient on hover */
      transform: translateY(-3px); /* More pronounced lift */
      box-shadow: 0 15px 40px rgba(0,0,0,0.5); /* Deeper shadow on hover */
    }

    .login-btn:active {
      transform: translateY(0); /* Press effect */
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Register Link */
    .register-link {
      margin-top: 2rem; /* More space */
      text-align: center;
      color: #ccc;
      font-size: 0.95rem; /* Slightly larger */
    }

    .register-link a {
      color: #c4b5fd;
      text-decoration: none;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .register-link a:hover {
      color: #a78bfa;
      text-decoration: underline;
    }

    /* Toggle Password Button */
    #togglePassword {
      position: absolute;
      right: 18px; /* Adjusted right for icon */
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
      font-size: 0.9rem; /* Slightly larger */
      color: #bbb;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    #togglePassword:hover {
      color: #7f5af0; /* Purple on hover */
    }

    /* Responsive adjustments */
    @media (max-width: 768px) {
      .phone-frame {
        padding: 2rem 1.5rem;
        max-width: 90%; /* Adjust max width for tablets */
      }
      .login-card {
        padding: 2rem 1.5rem;
      }
      .login-card h2 {
        font-size: 1.8rem;
        margin-bottom: 2rem;
      }
      .form-group input {
        padding: 12px 15px 12px 45px;
        font-size: 1rem;
      }
      .form-group label {
        left: 45px;
        font-size: 0.9rem;
      }
      .form-group input:focus + label,
      .form-group input:not(:placeholder-shown) + label {
        top: -10px;
        left: 10px;
        font-size: 0.7rem;
      }
      .form-group .icon {
        left: 15px;
        font-size: 1.1rem;
      }
      .login-btn {
        padding: 14px;
        font-size: 1.05rem;
      }
      .messages-container {
        margin-bottom: 1rem;
      }
      .success-message, .error-message {
        font-size: 0.9rem;
        padding: 0.7rem 1rem;
      }
      .success-sticker {
        width: 25px;
        height: 25px;
      }
    }

    @media (max-width: 480px) {
      .login-wrapper {
        padding: 0 15px;
      }
      .phone-frame {
        padding: 1.5rem 1rem;
        border-radius: 25px;
        min-height: auto; /* Allow height to adjust */
      }
      .login-card {
        padding: 1.5rem 1rem;
        border-radius: 20px;
      }
      .login-card h2 {
        font-size: 1.6rem;
        margin-bottom: 1.5rem;
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-group input {
        padding: 10px 12px 10px 40px;
        font-size: 0.95rem;
      }
      .form-group label {
        left: 40px;
        font-size: 0.85rem;
      }
      .form-group input:focus + label,
      .form-group input:not(:placeholder-shown) + label {
        top: -8px;
        left: 8px;
        font-size: 0.65rem;
      }
      .form-group .icon {
        left: 12px;
        font-size: 1rem;
      }
      .checkbox-group {
        font-size: 0.8rem;
        margin-bottom: 1rem;
      }
      .login-btn {
        padding: 12px;
        font-size: 1rem;
      }
      .register-link {
        margin-top: 1rem;
        font-size: 0.85rem;
      }
      #togglePassword {
        right: 12px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="background-blur"></div>

  <div class="login-wrapper">
    <div class="messages-container">
      <div class="error-message" id="error-message"></div>
      <div class="success-message" id="success-message">
        <svg class="success-sticker" viewBox="0 0 24 24" fill="currentColor">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
        </svg>
        Login successful! Redirecting...
      </div>
    </div>

    <div class="phone-frame">
      <div class="login-card">
        <h2>Welcome Back</h2>

        <div class="form-group">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/>
          </svg>
          <input type="email" id="email" placeholder=" " required autocomplete="username" />
          <label for="email">Email</label>
        </div>

        <div class="form-group">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18 10h-1V7c0-2.76-2.24-5-5-5S7 4.24 7 7v3H6c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2v-8c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3-9H9V7c0-1.66 1.34-3 3-3s3 1.34 3 3v3z"/>
          </svg>
          <input type="password" id="password" placeholder=" " required autocomplete="current-password" />
          <label for="password">Password</label>
          <span id="togglePassword" title="Show/Hide Password">Show</span>
        </div>

        <div class="checkbox-group">
          <label><input type="checkbox" id="rememberMe" /> Remember me</label>
          <a href="#">Forgot password?</a> <!-- Changed to # for now -->
        </div>

        <button class="login-btn" id="loginButton">Login</button>

        <div class="register-link">
          Don't have an account? <a href="#">Register here</a> <!-- Changed to # for now -->
        </div>
      </div>
    </div>
  </div>

<script>
  // Centralized API Base URL
  const API_BASE_URL = "http://localhost:5000"; // Or process.env.REACT_APP_API_URL if using a build tool

  document.addEventListener("DOMContentLoaded", () => {
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const rememberMeCheckbox = document.getElementById("rememberMe");
    const togglePasswordSpan = document.getElementById("togglePassword");
    const loginButton = document.getElementById("loginButton");
    const errorMessageDiv = document.getElementById("error-message");
    const successMessageDiv = document.getElementById("success-message");
    const forgotPasswordLink = document.querySelector('.checkbox-group a');
    const registerLink = document.querySelector('.register-link a');
    const body = document.body;

    // --- Utility Functions ---
    function showMessage(element, message, isError = false) {
      element.textContent = message;
      element.style.display = isError ? "block" : "flex"; // Use 'flex' for success message with icon
      // Hide the other message
      if (isError) {
        successMessageDiv.style.display = "none";
      } else {
        errorMessageDiv.style.display = "none";
      }
    }

    function toggleLoading(isLoading) {
      loginButton.disabled = isLoading;
      loginButton.textContent = isLoading ? "Authenticating..." : "Login";
    }

    // --- Event Listeners ---

    // Remember Me functionality
    const savedEmail = localStorage.getItem("userEmail");
    if (savedEmail) {
      emailInput.value = savedEmail;
      rememberMeCheckbox.checked = true;
      // Trigger label animation if email is pre-filled
      if (emailInput.value) {
        emailInput.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }

    // Toggle Password Visibility
    togglePasswordSpan.addEventListener("click", () => {
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePasswordSpan.textContent = "Hide";
        togglePasswordSpan.style.color = "#7c3aed";
      } else {
        passwordInput.type = "password";
        togglePasswordSpan.textContent = "Show";
        togglePasswordSpan.style.color = "#bbb";
      }
    });

    // Login Form Submission
    loginButton.addEventListener("click", async (event) => {
      event.preventDefault(); // Prevent default form submission

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      showMessage(errorMessageDiv, "", true); // Clear previous messages
      showMessage(successMessageDiv, "", false);

      if (!email || !password) {
        showMessage(errorMessageDiv, "Please enter both email and password.", true);
        return;
      }

      toggleLoading(true); // Show loading state

      try {
        const response = await fetch(`${API_BASE_URL}/api/auth/login`, { // Corrected endpoint if it's /api/auth/login
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          if (rememberMeCheckbox.checked) {
            localStorage.setItem("userEmail", email);
          } else {
            localStorage.removeItem("userEmail");
          }

          // Store user info (if your backend returns it)
          if (data.user?.name) {
            localStorage.setItem("chatbotUserName", data.user.name);
          }
          localStorage.setItem("chatbotUserEmail", email);
          if (data.token) { // Assuming your backend returns a token
            localStorage.setItem("token", data.token);
          }


          successMessageDiv.innerHTML = `
            <svg class="success-sticker" viewBox="0 0 24 24" fill="currentColor">
              <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/>
            </svg>
            Login successful! Redirecting...
          `;
          showMessage(successMessageDiv, "", false); // Display the success message HTML

          setTimeout(() => {
            body.classList.add("fade-out"); // Add fade-out animation
          }, 1000); // Start fade out after 1 second

          setTimeout(() => {
            // Check for user role and redirect
            if (data.user?.role === "admin") {
              // Note: For a single HTML file, you'd typically redirect to another HTML page.
              // If this is part of a larger SPA, you'd use client-side routing.
              window.location.href = "admin.html"; // Example admin page
            } else {
              window.location.href = "home.html"; // Example user dashboard page
            }
          }, 1800); // Redirect after fade-out animation
        } else {
          // Handle specific error messages from the backend
          if (data.message === "UserNotFound") {
            showMessage(errorMessageDiv, "Your account doesn't exist. Please register.", true);
          } else if (data.message === "InvalidPassword") {
            showMessage(errorMessageDiv, "Incorrect password. Please try again.", true);
          } else {
            showMessage(errorMessageDiv, data.message || "❌ Invalid credentials or don't have an account?", true);
          }
        }
      } catch (error) {
        showMessage(errorMessageDiv, "⚠️ Failed to connect to server. Please try again later.", true);
        console.error("Login error:", error);
      } finally {
        toggleLoading(false); // Hide loading state
      }
    });

    // Handle Forgot Password link click
    forgotPasswordLink.addEventListener('click', (event) => {
      event.preventDefault();
      alert('Forgot Password functionality is not yet implemented. Please contact support.');
      // In a real application, this would navigate to a password reset page or open a modal.
    });

    // Handle Register link click
    registerLink.addEventListener('click', (event) => {
      event.preventDefault();
      // In a real application, this would navigate to the registration page.
      window.location.href = "register.html"; // Assuming you have a register.html
    });
  });
</script>
</body>
</html>
