<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login | ChatBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #282843);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      transition: all 0.5s ease;
    }

    body.fade-out {
      animation: fadeOut 0.8s ease forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: scale(0.98);
      }
    }

    .background-blur {
      position: absolute;
      width: 250px;
      height: 250px;
      background: #7f5af0;
      filter: blur(120px);
      z-index: 0;
      top: 15%;
      left: 65%;
      opacity: 0.5;
    }

    .login-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
      position: relative;
      z-index: 1;
    }

    .messages-container {
      width: 100%;
      margin-bottom: 1rem;
      text-align: center;
    }

    .error-message {
      color: #fca5a5;
      background: rgba(255, 0, 0, 0.1);
      border-radius: 8px;
      padding: 0.6rem;
      display: none;
      font-size: 0.9rem;
      text-align: center;
    }

    .success-message {
      color: #a6ffb4;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      border-radius: 12px;
      padding: 0.8rem;
      font-size: 0.95rem;
      text-align: center;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.2);
      animation: fadeInSuccess 0.4s ease forwards;
      align-items: center;
      justify-content: center;
      gap: 10px;
      display: none;
    }

    .success-sticker {
      width: 40px;
      height: 40px;
      animation: bounceIn 0.5s ease;
    }

    @keyframes bounceIn {
      0% {
        transform: scale(0.5);
        opacity: 0;
      }
      60% {
        transform: scale(1.2);
        opacity: 1;
      }
      100% {
        transform: scale(1);
      }
    }

    @keyframes fadeInSuccess {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .phone-frame {
      width: 100%;
      max-width: 500px;
      height: 667px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 30px;
      overflow-y: auto;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      color: #fff;
      box-shadow:
        0 0 60px rgba(124, 58, 237, 0.4),
        0 0 20px rgba(124, 58, 237, 0.2),
        inset 0 0 10px rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      animation: glowPulse 3s ease-in-out infinite alternate;
    }

    .login-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      padding: 2rem 1.5rem;
      color: #fff;
      animation: fadeIn 1s ease-out forwards;
      transform: translateY(30px);
      opacity: 0;
    }

    @keyframes fadeIn {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .login-card h2 {
      text-align: center;
      margin-bottom: 2rem;
      font-size: 2rem;
      font-weight: 700;
    }

    .form-group {
      position: relative;
      margin-bottom: 1.8rem;
    }

    .form-group input {
      width: 100%;
      padding: 14px 18px 14px 48px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      transition: 0.3s ease;
    }

    .form-group input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 2px #fff3;
    }

    .form-group label {
      position: absolute;
      top: 50%;
      left: 48px;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: #ccc;
      pointer-events: none;
      transition: 0.3s ease;
    }

    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: -12px;
      left: 10px;
      font-size: 0.75rem;
      color: #eee;
      background: rgba(255, 255, 255, 0.15);
      padding: 0 6px;
      border-radius: 4px;
    }

    .form-group .icon {
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      font-size: 1.2rem;
      opacity: 0.8;
      color: #c4b5fd;
    }

    .checkbox-group {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
      color: #ddd;
    }

    .checkbox-group a {
      color: #c4b5fd;
      text-decoration: none;
    }

    .checkbox-group input {
      margin-right: 6px;
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(145deg, #6d28d9, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    .register-link {
      margin-top: 1.5rem;
      text-align: center;
      color: #ccc;
      font-size: 0.9rem;
    }

    .register-link a {
      color: #c4b5fd;
      text-decoration: none;
    }

    html, body {
      width: 100%;
      overflow-x: hidden;
    }
  </style>
</head>
<body>
  <div class="background-blur"></div>

  <div class="login-wrapper">
    <div class="messages-container">
      <div class="error-message" id="error-message"></div>
      <div class="success-message" id="success-message">
        <img src="https://img.icons8.com/?size=100&id=AefXIkx4A693&format=png&color=000000" class="success-sticker" alt="Success" />
        Login successful! Redirecting...
      </div>
    </div>

    <div class="phone-frame">
      <div class="login-card">
        <h2>Welcome Back</h2>

        <div class="form-group">
          <i class="fa-solid fa-envelope icon"></i>                         ## python -m http.server 8000
          <input type="email" id="email" placeholder=" " required />
          <label for="email">Email</label>
        </div>

        <div class="form-group">
          <i class="fa-solid fa-lock icon"></i>
          <input type="password" id="password" placeholder=" " required />
          <label for="password">Password</label>
          <span id="togglePassword" style="
              position: absolute;
              right: 16px;
              top: 50%;
              transform: translateY(-50%);
              cursor: pointer;
              user-select: none;
              font-size: 0.85rem;
              color: #bbb;
              font-weight: 600;
              transition: color 0.3s ease;" title="Show/Hide Password">Show</span>
        </div>

        <div class="checkbox-group">
          <label><input type="checkbox" id="rememberMe" /> Remember me</label>
          <a href="forgotpassword.html">Forgot password?</a>
        </div>

        <button class="login-btn" onclick="login()">Login</button>

        <div class="register-link">
          Don't have an account? <a href="register.html">Register here</a>
        </div>
      </div>
    </div>
  </div>

<script>
  window.addEventListener("DOMContentLoaded", () => {
    const savedEmail = localStorage.getItem("userEmail");
    if (savedEmail) {
      document.getElementById("email").value = savedEmail;
      document.getElementById("rememberMe").checked = true;
    }

    document.getElementById("togglePassword").addEventListener("click", () => {
      const passwordInput = document.getElementById("password");
      const toggle = document.getElementById("togglePassword");

      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        toggle.textContent = "Hide";
        toggle.style.color = "#7c3aed";
      } else {
        passwordInput.type = "password";
        toggle.textContent = "Show";
        toggle.style.color = "#bbb";
      }
    });
  });

  async function login() {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const errorMsg = document.getElementById("error-message");
    const successMsg = document.getElementById("success-message");

    errorMsg.style.display = "none";
    successMsg.style.display = "none";

    if (!email || !password) {
      errorMsg.textContent = "Please enter both email and password.";
      errorMsg.style.display = "block";
      return;
    }

    try {
      const response = await fetch("http://localhost:5000/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      const data = await response.json();

      if (response.ok) {
        if (document.getElementById("rememberMe").checked) {
          localStorage.setItem("userEmail", email);
        } else {
          localStorage.removeItem("userEmail");
        }

        if (data.user?.name) {
          localStorage.setItem("chatbotUserName", data.user.name);
        }
        localStorage.setItem("chatbotUserEmail", email);

        successMsg.innerHTML = `
          <img src="https://cdn-icons-png.flaticon.com/512/190/190411.png" class="success-sticker" alt="Success" />
          Login successful! Redirecting...
        `;
        successMsg.style.display = "flex";

        setTimeout(() => {
          document.body.classList.add("fade-out");
        }, 1000);

        setTimeout(() => {
          if (data.user?.role === "admin") {
            successMsg.innerHTML = `
              <img src="https://cdn-icons-png.flaticon.com/512/190/190411.png" class="success-sticker" alt="Success" />
              🛡️ Admin has logged in! Redirecting to dashboard...
            `;
            window.location.href = "admin.html";
          } else {
            window.location.href = "home.html";
          }
        }, 1800);
      } else {
        if (data.message === "UserNotFound") {
          errorMsg.textContent = "Your account doesn't exist. Please register.";
        } else if (data.message === "InvalidPassword") {
          errorMsg.textContent = "Incorrect password. Please try again.";
        } else {
          errorMsg.textContent = data.message || "❌ Invalid credentials or don't have an account?";
        }
        errorMsg.style.display = "block";
      }
    } catch (error) {
      errorMsg.textContent = "⚠️ Failed to connect to server.";
      errorMsg.style.display = "block";
      console.error("Login error:", error);
    }
  }
</script>
</body>
</html>
