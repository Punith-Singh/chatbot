<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | ChatBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    
    .animate-delay-fade-in-up {
      animation: fadeInUp 0.7s ease-out 0.4s forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message-enter {
      animation: messageEnter 0.4s ease-out forwards;
    }

    @keyframes messageEnter {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .loading .btn-text {
      opacity: 0;
    }
    .loading .spinner {
      opacity: 1;
    }
    
    body.fade-out {
      animation: fadeOut 0.8s ease forwards;
    }

    @keyframes fadeOut {
      to {
        opacity: 0;
        transform: scale(0.98);
      }
    }

    .inner-screen::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        100deg,
        rgba(255, 255, 255, 0) 20%,
        rgba(255, 255, 255, 0.1) 50%,
        rgba(255, 255, 255, 0) 80%
      );
      transform: skewX(-20deg);
      animation: shine 5s infinite linear 2s; 
      z-index: 1;
    }

    @keyframes shine {
      0% { left: -150%; }
      100% { left: 150%; }
    }

    .phone-frame {
      position: relative;
    }

    .phone-frame::before {
      content: '';
      position: absolute;
      top: -4px; 
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 60px; 
      padding: 4px;
      background: linear-gradient(60deg, #6366f1, #a855f7, #6366f1);
      background-size: 300% 300%;
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      filter: blur(8px);
      animation: rotateGlow 3s linear infinite;
      z-index: -1;
    }
    
    @keyframes rotateGlow {
      to { background-position: 300% 0; }
    }
    
    .inner-screen {
        -ms-overflow-style: none;
        scrollbar-width: none;
    }
    .inner-screen::-webkit-scrollbar {
        display: none;
    }
    .form-input {
      transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
      box-shadow: 0 2px 4px 0 rgba(0, 0, 0, 0.1);
    }
    .form-input:focus {
      border-color: #6366f1; /* indigo-500 */
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.3), 0 2px 4px 0 rgba(0, 0, 0, 0.1);
      outline: none;
    }

    /* Three dot pulse animation */
    .spinner {
      display: flex;
      gap: 4px;
    }
    .spinner > div {
      width: 8px;
      height: 8px;
      background-color: white;
      border-radius: 50%;
      animation: pulse 1.2s infinite ease-in-out;
    }
    .spinner > div:nth-child(1) {
      animation-delay: -0.24s;
    }
    .spinner > div:nth-child(2) {
      animation-delay: -0.12s;
    }
    .spinner > div:nth-child(3) {
      animation-delay: 0s;
    }
    @keyframes pulse {
      0%, 80%, 100% {
        transform: scale(0);
        opacity: 0.5;
      } 40% {
        transform: scale(1);
        opacity: 1;
      }
    }

  </style>
</head>
<body class="bg-gray-900 text-white">

  <div class="absolute -top-20 -left-20 w-72 h-72 bg-indigo-600/40 rounded-full filter blur-3xl opacity-50 animate-pulse"></div>
  <div class="absolute -bottom-20 -right-20 w-72 h-72 bg-purple-600/40 rounded-full filter blur-3xl opacity-50 animate-pulse" style="animation-delay: 2s;"></div>

  <div class="relative z-10 flex min-h-screen w-full items-center justify-center p-4">
    <div class="login-wrapper w-full max-w-md flex flex-col items-center">
      
      <div class="messages-container w-full max-w-sm mb-4 min-h-[48px]">
        <div id="error-message" class="hidden items-center justify-center gap-2 rounded-lg border border-red-700 bg-red-900/50 p-3 text-sm font-medium text-red-300">
          <span class="message-text"></span>
        </div>
        <div id="success-message" class="hidden items-center justify-center gap-2 rounded-lg border border-green-700 bg-green-900/50 p-3 text-sm font-medium text-green-300">
        </div>
      </div>

      <div class="phone-frame animate-fade-in-up w-full max-w-sm rounded-[56px] border-8 border-gray-800 bg-gray-900 shadow-2xl shadow-indigo-500/10">
        <div class="inner-screen w-full h-[720px] rounded-[48px] bg-gray-950/70 relative overflow-y-auto px-6 pt-12 pb-6 backdrop-blur-[10px] flex flex-col justify-center">
          
          <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-black rounded-b-2xl z-30"></div>
          
          <div class="login-content animate-delay-fade-in-up w-full relative z-20">
            <h2 class="mb-3 text-center text-3xl font-bold text-white">
              Forgot Password
            </h2>
            <p class="mb-6 text-center text-gray-300">
              Enter your email to get a reset code.
            </p>

            <div class="relative mb-6">
              <div class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-3.5">
                <svg class="h-5 w-5 text-gray-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M1.5 8.67v8.58a3 3 0 003 3h15a3 3 0 003-3V8.67l-8.928 5.493a3 3 0 01-3.144 0L1.5 8.67z" />
                  <path d="M22.5 6.908V6.75a3 3 0 00-3-3h-15a3 3 0 00-3 3v.158l9.714 5.978a1.5 1.5 0 001.572 0L22.5 6.908z" />
                </svg>
              </div>
              <input
                type="email"
                id="email"
                class="form-input peer block w-full rounded-md border border-gray-700 bg-gray-800 py-3 pl-11 pr-4 text-white placeholder-gray-400 transition-colors focus:border-indigo-500 focus:bg-gray-700 focus:outline-none"
                placeholder="Email"
                required
              />
            </div>

            <button class="login-btn group relative flex h-11 w-full items-center justify-center rounded-md bg-gradient-to-r from-indigo-500 to-purple-500 px-4 py-2.5 text-base font-semibold text-white disabled:bg-gray-600 disabled:from-gray-600 disabled:to-gray-700 disabled:cursor-not-allowed" id="send-code-btn">
              <span class="btn-text transition-opacity duration-200">Send Code</span>
              <div class="spinner absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 opacity-0 transition-opacity duration-200">
                <div></div>
                <div></div>
                <div></div>
              </div>
            </button>

            <div class="mt-6 text-center text-sm text-gray-300">
              Remembered your password?
              <a href="login.html" class="font-medium text-indigo-400 hover:text-indigo-200 hover:underline">
                Login here
              </a>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const emailInput = document.getElementById('email');
    const sendCodeBtn = document.getElementById('send-code-btn');
    const errorMsg = document.getElementById('error-message');
    const successMsg = document.getElementById('success-message');
    
    // Check if email is passed from forgot-password page
    const urlParams = new URLSearchParams(window.location.search);
    const emailFromQuery = urlParams.get('email');
    if (emailFromQuery) {
        emailInput.value = emailFromQuery;
    }

    const sendResetCode = async () => {
      const email = emailInput.value.trim();

      hideMessages();

      if (!email || !/^\S+@\S+\.\S+$/.test(email)) {
        showMessage(errorMsg, 'Please enter a valid email address.');
        return;
      }
      
      setLoading(true);

      try {
        const response = await fetch('http://localhost:5000/forgot-password', {
         method: 'POST',
         headers: { 'Content-Type': 'application/json' },
         body: JSON.stringify({ email }),
        });
        const data = await response.json();
        
        if (response.ok) {
          const successIcon = `<svg class="h-5 w-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" /></svg>`;
          showMessage(successMsg, `${successIcon} Verification code sent! Please check your email.`, true);
          setTimeout(() => {
            // Pass email to the next page to pre-fill it
            window.location.href = `reset-password.html?email=${encodeURIComponent(email)}`;
          }, 2000);
        } else {
          showMessage(errorMsg, data.message || 'Failed to send reset code.');
          setLoading(false);
        }
      } catch (err) {
        showMessage(errorMsg, 'Server error. Please try again later.');
        setLoading(false);
        console.error("Forgot Password Error:", err);
      }
    };
    
    sendCodeBtn.addEventListener('click', sendResetCode);
    emailInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            sendResetCode();
        }
    });

    function showMessage(element, text, isSuccess = false) {
      hideMessages();
      
      if (isSuccess) {
          element.innerHTML = text; // Assumes text includes an icon
      } else {
          const textElement = element.querySelector('.message-text');
          if (textElement) {
              textElement.textContent = text;
          }
      }
      
      element.classList.remove("hidden");
      element.classList.add("flex", "message-enter");
      setTimeout(() => element.classList.remove("message-enter"), 400);
    }

    function hideMessages() {
      errorMsg.classList.add("hidden");
      errorMsg.classList.remove("flex", "message-enter");
      successMsg.classList.add("hidden");
      successMsg.classList.remove("flex", "message-enter");
    }

    function setLoading(isLoading) {
      sendCodeBtn.disabled = isLoading;
      sendCodeBtn.classList.toggle('loading', isLoading);
    }
});
</script>
</body>
</html>
