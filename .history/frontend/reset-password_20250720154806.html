<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password | ChatBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    /* Basic reset and font import */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    /* Body styling for background and centering content */
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #282843);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden; /* Prevent scrollbars from blur effect */
      position: relative;
      color: #fff; /* Default text color */
    }

    /* Background blur elements for visual effect */
    .background-blur {
      position: absolute;
      width: 250px;
      height: 250px;
      background: #7f5af0;
      filter: blur(120px);
      z-index: 0;
      top: 15%;
      left: 65%;
      opacity: 0.5;
    }

    /* Wrapper for the entire reset password content */
    .reset-password-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 90%; /* Responsive width */
      max-width: 500px; /* Max width for larger screens */
      position: relative;
      z-index: 1;
      padding: 1rem; /* Add some padding for smaller screens */
    }

    /* Container for error/success messages */
    .messages-container {
      width: 100%;
      margin-bottom: 1rem;
      text-align: center;
    }

    /* Styling for error and success messages */
    .error-message, .success-message {
      padding: 0.8rem;
      font-size: 0.95rem;
      border-radius: 10px;
      display: none; /* Hidden by default */
      opacity: 0;
      transition: opacity 0.5s ease, transform 0.3s ease;
      transform: translateY(-10px);
    }

    /* Styles for showing messages */
    .error-message.show, .success-message.show {
      display: flex; /* Use flex to align icon and text */
      opacity: 1;
      transform: translateY(0);
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    /* Specific styling for error messages */
    .error-message {
      background: rgba(255, 0, 0, 0.15);
      color: #f87171;
    }

    /* Specific styling for success messages */
    .success-message {
      background: rgba(34, 197, 94, 0.15);
      color: #a6ffb4;
      border: 1px solid rgba(34, 197, 94, 0.3);
      font-weight: 600;
    }

    /* Styling for the success sticker (SVG icon) */
    .success-sticker {
      width: 24px; /* Adjusted size for better integration */
      height: 24px;
      flex-shrink: 0;
      fill: #a6ffb4; /* Color the SVG to match text */
    }

    /* Phone frame container styling */
    .phone-frame {
      width: 100%; /* Responsive width */
      height: auto; /* Auto height based on content */
      background: rgba(255, 255, 255, 0.05);
      border-radius: 30px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 2rem 1.5rem;
      z-index: 1;
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      box-shadow:
        0 0 60px rgba(124, 58, 237, 0.4),
        0 0 20px rgba(124, 58, 237, 0.2),
        inset 0 0 10px rgba(255, 255, 255, 0.05);
      animation: glowPulse 3s ease-in-out infinite alternate; /* Pulsing glow effect */
    }

    /* Keyframe animation for the glow effect */
    @keyframes glowPulse {
      0% {
        box-shadow:
          0 0 60px rgba(124, 58, 237, 0.4),
          0 0 20px rgba(124, 58, 237, 0.2),
          inset 0 0 10px rgba(255, 255, 255, 0.05);
      }
      100% {
        box-shadow:
          0 0 70px rgba(124, 58, 237, 0.6),
          0 0 25px rgba(124, 58, 237, 0.3),
          inset 0 0 12px rgba(255, 255, 255, 0.07);
      }
    }

    /* Styling for the reset password card */
    .reset-password-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
      animation: fadeInUp 0.8s ease-out forwards; /* Fade in animation */
      opacity: 0;
      transform: translateY(30px);
    }

    /* Keyframe animation for fade in effect */
    @keyframes fadeInUp {
      0% {
        opacity: 0;
        transform: translateY(30px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Heading style */
    .reset-password-card h2 {
      margin-bottom: 2rem;
      font-size: 2rem;
      font-weight: 700;
    }

    /* Form group container */
    .form-group {
      position: relative;
      margin-bottom: 1.8rem;
      text-align: left;
    }

    /* Input field styling */
    .form-group input {
      width: 100%;
      padding: 14px 18px 14px 48px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      font-size: 1rem;
      outline: none; /* Remove default outline */
      transition: background 0.3s ease, box-shadow 0.3s ease;
    }

    .form-group input:focus {
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 2px #7f5af0; /* Focus glow */
    }

    /* Label styling for input fields */
    .form-group label {
      position: absolute;
      top: 50%;
      left: 48px;
      transform: translateY(-50%);
      font-size: 0.95rem;
      color: #ccc;
      pointer-events: none;
      transition: 0.3s ease;
    }

    /* Label animation on focus or filled input */
    .form-group input:focus + label,
    .form-group input:not(:placeholder-shown) + label {
      top: -12px;
      left: 10px;
      font-size: 0.75rem;
      color: #eee;
      background: rgba(255, 255, 255, 0.15);
      padding: 0 6px;
      border-radius: 4px;
    }

    /* Icon styling within input fields */
    .icon.themed-icon {
      color: #c4b5fd;
      font-size: 1.2rem;
      position: absolute;
      top: 50%;
      left: 16px;
      transform: translateY(-50%);
      opacity: 0.9;
    }

    /* Toggle password visibility button */
    .toggle-password {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      user-select: none;
      font-size: 0.85rem;
      color: #bbb;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .toggle-password.active {
      color: #a855f7;
    }

    /* Submit button styling */
    .submit-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(145deg, #6d28d9, #7c3aed);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.3s ease;
      display: flex; /* For centering loading spinner */
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .submit-btn:hover:not(:disabled) {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      transform: translateY(-2px);
    }

    .submit-btn:disabled {
      background: linear-gradient(145deg, #4a1e8a, #5c2ea0); /* Darker for disabled state */
      cursor: not-allowed;
      opacity: 0.7;
    }

    /* Loading spinner animation */
    .loading-spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Media queries for responsiveness */
    @media (max-width: 600px) {
      .phone-frame {
        padding: 1.5rem 1rem; /* Adjust padding for smaller screens */
        border-radius: 20px;
      }

      .reset-password-card {
        padding: 1.5rem 1rem;
        border-radius: 15px;
      }

      .reset-password-card h2 {
        font-size: 1.7rem;
        margin-bottom: 1.5rem;
      }

      .form-group input {
        padding: 12px 16px 12px 42px;
        font-size: 0.95rem;
      }

      .form-group label {
        left: 42px;
        font-size: 0.9rem;
      }

      .form-group input:focus + label,
      .form-group input:not(:placeholder-shown) + label {
        top: -10px;
        left: 8px;
        font-size: 0.7rem;
      }

      .icon.themed-icon {
        left: 12px;
        font-size: 1.1rem;
      }

      .toggle-password {
        right: 12px;
        font-size: 0.8rem;
      }

      .submit-btn {
        padding: 10px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="background-blur"></div>

  <div class="reset-password-wrapper">
    <div class="messages-container" role="status" aria-live="polite">
      <div class="error-message" id="error-message"></div>
      <div class="success-message" id="success-message"></div>
    </div>

    <div class="phone-frame">
      <div class="reset-password-card">
        <h2>Reset Password</h2>

        <div class="form-group">
          <i class="fa-solid fa-envelope icon themed-icon" aria-hidden="true"></i>
          <input type="email" id="email" placeholder=" " required aria-label="Email" />
          <label for="email">Email</label>
        </div>

        <div class="form-group">
          <i class="fa-solid fa-key icon themed-icon" aria-hidden="true"></i>
          <input type="text" id="code" placeholder=" " required aria-label="Verification Code" />
          <label for="code">Verification Code</label>
        </div>

        <div class="form-group">
          <i class="fa-solid fa-lock icon themed-icon" aria-hidden="true"></i>
          <input type="password" id="new-password" placeholder=" " required aria-label="New Password" />
          <label for="new-password">New Password</label>
          <span id="togglePasswordNew" class="toggle-password" onclick="togglePassword('new-password', this)" role="button" tabindex="0" aria-label="Toggle new password visibility">Show</span>
        </div>

        <div class="form-group">
          <i class="fa-solid fa-lock icon themed-icon" aria-hidden="true"></i>
          <input type="password" id="confirm-password" placeholder=" " required aria-label="Confirm Password" />
          <label for="confirm-password">Confirm Password</label>
          <span id="togglePasswordConfirm" class="toggle-password" onclick="togglePassword('confirm-password', this)" role="button" tabindex="0" aria-label="Toggle confirm password visibility">Show</span>
        </div>

        <button type="button" class="submit-btn" id="reset-button" onclick="submitReset()">
          <span id="button-text">Reset Password</span>
          <div id="loading-spinner" class="loading-spinner" style="display: none;"></div>
        </button>
      </div>
    </div>
  </div>

  <script>
    // Get references to DOM elements
    const emailField = document.getElementById("email");
    const codeField = document.getElementById("code");
    const newPasswordField = document.getElementById("new-password");
    const confirmPasswordField = document.getElementById("confirm-password");
    const errorMsg = document.getElementById("error-message");
    const successMsg = document.getElementById("success-message");
    const resetButton = document.getElementById("reset-button");
    const buttonText = document.getElementById("button-text");
    const loadingSpinner = document.getElementById("loading-spinner");

    /**
     * Toggles the visibility of a password field.
     * @param {string} fieldId - The ID of the password input field.
     * @param {HTMLElement} toggleElement - The span element that triggers the toggle.
     */
    function togglePassword(fieldId, toggleElement) {
      const field = document.getElementById(fieldId);
      const isShowing = field.type === "text";
      field.type = isShowing ? "password" : "text";
      toggleElement.textContent = isShowing ? "Show" : "Hide";
      toggleElement.classList.toggle("active", !isShowing);
      toggleElement.setAttribute('aria-label', `Toggle ${fieldId.replace('-', ' ')} visibility ${isShowing ? 'show' : 'hide'}`);
    }

    /**
     * Displays an error message.
     * @param {string} message - The error message to display.
     */
    function showError(message) {
      errorMsg.textContent = message;
      errorMsg.classList.add("show");
      successMsg.classList.remove("show");
      errorMsg.setAttribute('aria-live', 'assertive'); // Announce immediately
      successMsg.removeAttribute('aria-live');
    }

    /**
     * Displays a success message with an inline SVG sticker.
     * @param {string} message - The success message to display.
     */
    function showSuccess(message) {
      // Inline SVG for the success sticker
      const successSvg = `
        <svg class="success-sticker" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C6.47715 2 2 6.47715 2 12C2 17.5228 6.47715 22 12 22C17.5228 22 22 17.5228 22 12C22 6.47715 17.5228 2 12 2ZM16.7071 9.29289C17.0976 8.90237 17.0976 8.26921 16.7071 7.87868C16.3166 7.48816 15.6834 7.48816 15.2929 7.87868L10 13.1716L8.29289 11.4645C7.90237 11.074 7.26921 11.074 6.87868 11.4645C6.48816 11.855 6.48816 12.4882 6.87868 12.8787L9.29289 15.2929C9.68342 15.6834 10.3166 15.6834 10.7071 15.2929L16.7071 9.29289Z"/>
        </svg>
      `;
      successMsg.innerHTML = `${successSvg} ${message}`;
      successMsg.classList.add("show");
      errorMsg.classList.remove("show");
      successMsg.setAttribute('aria-live', 'assertive'); // Announce immediately
      errorMsg.removeAttribute('aria-live');
    }

    /**
     * Validates an email address format.
     * @param {string} email - The email string to validate.
     * @returns {boolean} True if the email is valid, false otherwise.
     */
    function isEmailValid(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }

    // Add event listeners to hide messages when user starts typing
    [emailField, codeField, newPasswordField, confirmPasswordField].forEach((input) => {
      input.addEventListener("input", () => {
        errorMsg.classList.remove("show");
        successMsg.classList.remove("show");
        errorMsg.removeAttribute('aria-live');
        successMsg.removeAttribute('aria-live');
      });
    });

    /**
     * Handles the password reset submission.
     * Simulates an API call since there's no backend.
     */
    async function submitReset() {
      const email = emailField.value.trim();
      const code = codeField.value.trim();
      const newPassword = newPasswordField.value.trim();
      const confirmPassword = confirmPasswordField.value.trim();

      // Client-side validation
      if (!email || !code || !newPassword || !confirmPassword) {
        showError("All fields are required.");
        return;
      }

      if (!isEmailValid(email)) {
        showError("Invalid email format.");
        return;
      }

      if (newPassword.length < 6) { // Example: minimum password length
        showError("New password must be at least 6 characters long.");
        return;
      }

      if (newPassword !== confirmPassword) {
        showError("Passwords do not match.");
        return;
      }

      // Show loading state
      buttonText.textContent = "Resetting...";
      loadingSpinner.style.display = "block";
      resetButton.disabled = true;

      try {
        // Simulate API call with a delay
        await new Promise(resolve => setTimeout(resolve, 2000)); // Simulate 2-second network delay

        // Simulate backend response
        // For demonstration:
        // - Success if email is 'test@example.com' and code is '12345'
        // - Error otherwise
        if (email === "test@example.com" && code === "12345") {
          showSuccess("Password successfully changed! You can now log in with your new password.");
          // In a real application, you would redirect here:
          // setTimeout(() => {
          //   window.location.href = "login.html";
          // }, 3000);
        } else {
          showError("Invalid email or verification code. Please try again.");
        }
      } catch (error) {
        console.error("Reset password error:", error);
        showError("An unexpected error occurred. Please try again later.");
      } finally {
        // Hide loading state
        buttonText.textContent = "Reset Password";
        loadingSpinner.style.display = "none";
        resetButton.disabled = false;
      }
    }
  </script>
</body>
</html>
