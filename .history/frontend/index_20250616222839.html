<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ChatBot Landing</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #282843);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
      color: #fff;
      width: 100%;
    }

    .background-blur,
    .background-blur::before,
    .background-blur::after {
      position: absolute;
      content: "";
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, #7f5af0, transparent 70%);
      filter: blur(120px);
      opacity: 0.4;
      animation: float 10s ease-in-out infinite alternate;
    }

    .background-blur::before {
      top: 10%;
      left: 20%;
      animation-delay: 2s;
    }

    .background-blur::after {
      top: 60%;
      left: 70%;
      animation-delay: 4s;
    }

    @keyframes float {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-20px) scale(1.1); }
    }

    .phone-container {
  width: 500px;
  height: 667px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 30px;
  overflow-y: auto;
  padding: 2rem 1.5rem;
  display: flex;
  flex-direction: column;
  justify-content: center;
  position: relative;
  z-index: 1;
  color: #fff;
  backdrop-filter: blur(20px);

  /* Glowing + inner shadow */
  box-shadow:
    0 0 60px rgba(124, 58, 237, 0.4),   /* vibrant outer glow */
    0 0 20px rgba(124, 58, 237, 0.2),   /* subtle ambient glow */
    inset 0 0 10px rgba(255, 255, 255, 0.05); /* soft glassy shine */

  animation: glowPulse 3s ease-in-out infinite alternate;
}


    .login-card {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      padding: 2rem 1.5rem;
      animation: fadeIn 1.2s ease-out forwards;
      transform: translateY(30px);
      opacity: 0;
      text-align: center;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    @keyframes fadeIn {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .login-card h1 {
      font-size: 2.6rem;
      font-weight: 700;
      margin-bottom: 1.2rem;
      text-shadow: 0 2px 10px rgba(127, 90, 240, 0.5);
    }

    .login-card p {
      font-size: 1.1rem;
      color: #ddd;
      margin-bottom: 2rem;
    }

    .btn-container {
      margin-top: auto;
    }

    .btn-container a {
      display: inline-block;
      margin: 0 10px;
      padding: 14px 26px;
      border-radius: 15px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      background: linear-gradient(145deg, #6d28d9, #7c3aed);
      color: #fff;
      transition: all 0.4s ease;
      box-shadow: 0 10px 25px rgba(124, 58, 237, 0.3);
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
    }

    .btn-container a::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.15), transparent 40%);
      transform: rotate(25deg);
      pointer-events: none;
      transition: all 0.4s ease;
    }

    .btn-container a:hover {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      transform: scale(1.05);
      box-shadow: 0 12px 35px rgba(124, 58, 237, 0.5);
    }

    .btn-container a:hover::before {
      top: -20%;
      left: -20%;
    }

    @media (max-width: 480px) {
      .phone-container {
        width: 100%;
        height: 100vh;
        border-radius: 0;
        padding: 1.5rem 1rem;
        box-shadow: none;
      }

      .login-card {
        padding: 1.5rem 1rem;
        border-radius: 0;
        box-shadow: none;
      }

      .login-card h1 {
        font-size: 2rem;
      }

      .login-card p {
        font-size: 1rem;
      }

      .btn-container a {
        padding: 10px 18px;
        font-size: 0.9rem;
        margin: 0 5px;
      }
    }
  </style>
</head>
<body>
  <div class="background-blur"></div>

  <div class="phone-container">
    <div class="login-card">
      <h1>Welcome to ChatBot</h1>
      <img src="favicon.png" alt="ChatBot Icon" style="width: 150px; height: 150px; margin: 20px auto; border-radius: 20px; box-shadow: 0 0 20px rgba(127,90,240,0.4);" />
      <p>Your smart assistant, one click away</p>

      <div class="btn-container">
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </div>
    </div>
  </div>
</body>
</html>
