<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome | ChatBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }

    .animate-fade-in-up {
      animation: fadeInUp 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(20px);
    }
    
    .animate-delay-fade-in-up {
      animation: fadeInUp 0.7s ease-out 0.4s forwards;
      opacity: 0;
      transform: translateY(10px);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .inner-screen::after {
      content: '';
      position: absolute;
      top: 0;
      left: -150%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        100deg,
        rgba(255, 255, 255, 0) 20%,
        rgba(255, 255, 255, 0.05) 50%,
        rgba(255, 255, 255, 0) 80%
      );
      transform: skewX(-20deg);
      animation: shine 5s infinite linear 2s; 
      z-index: 1;
    }

    @keyframes shine {
      0% { left: -150%; }
      100% { left: 150%; }
    }

    .phone-frame {
      position: relative;
    }

    .phone-frame::before {
      content: '';
      position: absolute;
      top: -4px; 
      left: -4px;
      right: -4px;
      bottom: -4px;
      border-radius: 60px; 
      padding: 4px;
      background: linear-gradient(60deg, #6366f1, #a855f7, #6366f1);
      background-size: 300% 300%;
      -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      filter: blur(8px);
      animation: rotateGlow 3s linear infinite;
      z-index: -1;
    }
    
    @keyframes rotateGlow {
      to { background-position: 300% 0; }
    }

    /* Hide scrollbar */
    .inner-screen {
      -ms-overflow-style: none;  /* IE and Edge */
      scrollbar-width: none;  /* Firefox */
    }
    .inner-screen::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
    }

  </style>
</head>
<body class="bg-gray-900 text-white">

  <div class="absolute -top-20 -left-20 w-72 h-72 bg-indigo-600/40 rounded-full filter blur-3xl opacity-50 animate-pulse"></div>
  <div class="absolute -bottom-20 -right-20 w-72 h-72 bg-purple-600/40 rounded-full filter blur-3xl opacity-50 animate-pulse" style="animation-delay: 2s;"></div>

  <div class="relative z-10 flex min-h-screen w-full items-center justify-center p-4">
    <div class="login-wrapper w-full max-w-md flex flex-col items-center">
      
      <!-- Placeholder for any global messages -->
      <div class="messages-container w-full max-w-sm mb-4 min-h-[48px]">
      </div>

      <div class="phone-frame animate-fade-in-up w-full max-w-sm rounded-[56px] border-8 border-gray-800 bg-gray-900 shadow-2xl shadow-indigo-500/10">
        <div class="inner-screen w-full h-[720px] rounded-[48px] bg-gray-950/70 relative overflow-y-auto px-6 pt-12 pb-6 backdrop-blur-[10px]">
          
          <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-black rounded-b-2xl z-30"></div>
          
          <div class="login-content animate-delay-fade-in-up w-full h-full flex flex-col relative z-20">
            
            <!-- Centered Landing Page Content -->
            <div class="flex h-full flex-col items-center justify-center text-center">
              
              <!-- Icon -->
              <img 
                src="favicon.png" 
                alt="ChatBot Icon" 
                class="h-32 w-32 rounded-2xl mb-6 shadow-lg shadow-indigo-500/30"
              />
              
              <!-- Title -->
              <h1 class="text-3xl font-bold text-white mb-3">
                Welcome to ChatBot
              </h1>
              
              <!-- Subtitle -->
              <p class="text-gray-300 text-base mb-10">
                Your smart, conversational AI assistant.
              </p>

              <!-- Button Container -->
              <div class="w-full max-w-xs space-y-4">
                
                <!-- Primary Button (Login) -->
                <a href="login.html" class="inline-flex justify-center w-full login-btn group relative rounded-md bg-gradient-to-r from-indigo-500 to-purple-500 px-4 py-2.5 text-base font-semibold text-white transition-all duration-200 ease-in-out hover:from-indigo-400 hover:to-purple-400 hover:scale-[1.03] hover:shadow-lg hover:shadow-indigo-500/40 active:scale-[.98] active:shadow-none">
                  Login
                </a>
                
                <!-- Secondary Button (Create Account) -->
                <a href="signup.html" class="inline-flex justify-center w-full rounded-md border border-indigo-500 bg-transparent px-4 py-2.5 text-base font-semibold text-indigo-300 transition-all duration-200 ease-in-out hover:bg-indigo-500/10 hover:text-indigo-200 active:scale-[.98]">
                  Create Account
                </a>
                
              </div>
            </div>
            
          </div>
        </div>
      </div>

    </div>
  </div>
  
</body>
</html>
