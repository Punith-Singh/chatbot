<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create Account</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #282843);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    .background-blur {
      position: absolute;
      width: 220px;
      height: 220px;
      background: #7f5af0;
      filter: blur(100px);
      z-index: 0;
      top: 15%;
      left: 65%;
      opacity: 0.5;
    }

    .phone-container {
      width: 500px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 28px;
      padding: 2rem 1.8rem;
      position: relative;
      z-index: 1;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(124, 58, 237, 0.4), 0 0 20px rgba(124, 58, 237, 0.2), inset 0 0 10px rgba(255, 255, 255, 0.05);
    }

    .login-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      padding: 1.7rem 1.8rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      animation: fadeIn 1s ease-out forwards;
      transform: translateY(30px);
      opacity: 0;
    }

    @keyframes fadeIn {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    h2 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.1rem;
    }

    label {
      display: block;
      margin-bottom: 0.25rem;
      font-weight: 500;
      text-align: left;
      font-size: 0.85rem;
      color: #ddd;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="date"] {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 1rem;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #eee;
      font-size: 0.9rem;
    }

    input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.2);
    }

    input::placeholder {
      color: #bbb;
    }

    .gender-options {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.1rem;
    }

    .gender-options label {
      display: flex;
      align-items: center;
      font-size: 0.8rem;
      color: #ddd;
    }

    .gender-options input[type="radio"] {
      margin-right: 6px;
      accent-color: #7c3aed;
    }

    .submit-btn {
      width: 100%;
      padding: 12px 0;
      background: linear-gradient(145deg, #6d28d9, #7c3aed);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.3);
      transition: background 0.3s ease, transform 0.3s ease;
    }

    .submit-btn:hover {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      transform: translateY(-2px);
    }

    .submit-btn:disabled {
      background-color: #5a57a5;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    .password-validation {
      display: none;
      background: rgba(255, 255, 255, 0.05);
      padding: 0.8rem 1rem;
      border-radius: 10px;
      margin-top: -0.8rem;
      margin-bottom: 1.2rem;
      text-align: left;
    }

    .password-validation .criteria {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      margin-bottom: 6px;
    }

    .password-validation .criteria span {
      display: inline-block;
      width: 18px;
      text-align: center;
    }

    .password-validation .valid span {
      color: #34d399;
      transform: scale(1.2);
    }

    .password-validation .invalid span {
      color: #f87171;
    }

    #passwordStrength {
      display: none;
      text-align: left;
      font-weight: 500;
      font-size: 0.9rem;
      margin-top: 0.25rem;
      color: #f87171;
    }

    #confirmPasswordError {
      color: #f87171;
      font-size: 0.9rem;
      margin-bottom: 1rem;
      display: none;
      text-align: left;
    }

    .success-message {
      display: none;
      margin-top: 1.5rem;
      padding: 1rem 1.2rem;
      background: rgba(34, 197, 94, 0.12);
      border-left: 4px solid #22c55e;
      border-radius: 10px;
      color: #bbf7d0;
      font-size: 0.95rem;
      text-align: left;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .success-message strong {
      color: #86efac;
      font-weight: 600;
      margin-right: 8px;
    }

    @media (max-width: 500px) {
      .phone-container {
        width: 100%;
        padding: 1.5rem 1rem;
        border-radius: 20px;
      }
    }

 .password-toggle {
  display: flex;
  align-items: center;
  width: 100%;
  background: rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  margin-bottom: 1rem;
  padding: 0 12px; /* matching regular input padding */
  height: auto; /* match input height */
  border: none;
}

.password-toggle input {
  flex: 1;
  border: none;
  background: transparent;
  color: #eee;
  font-size: 0.9rem;
  padding: 10px 0; /* match regular input padding */
  height: 100%;
  outline: none;
  border-radius: 0;
}

.toggle-eye {
  padding-left: 10px;
  color: #bbb;
  cursor: pointer;
  font-size: 0.85rem;
  font-weight: 500;
  user-select: none;
  transition: color 0.3s ease;
}


  </style>
</head>
<body>
  <div class="background-blur"></div>
  <div class="phone-container">
    <div class="login-card">
      <h2>Create Your Account</h2>
      <form id="signupForm" novalidate>
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe" required />

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" required />

        <label>Gender</label>
        <div class="gender-options">
          <label><input type="radio" name="gender" value="Male" required /> Male</label>
          <label><input type="radio" name="gender" value="Female" /> Female</label>
          <label><input type="radio" name="gender" value="Other" /> Other</label>
        </div>

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="example@gmail.com" required />

        <label for="password">Password</label>
        <div class="password-toggle">
          <input type="password" id="password" placeholder="Enter password" required autocomplete="new-password" />
          <span class="toggle-eye" onclick="toggleVisibility('password', this)">Show</span>
        </div>

        <div class="password-validation" id="passwordValidation">
          <div class="criteria" id="lengthCriteria"><span>❌</span> Minimum 8 characters</div>
          <div class="criteria" id="uppercaseCriteria"><span>❌</span> At least 1 uppercase letter</div>
          <div class="criteria" id="lowercaseCriteria"><span>❌</span> At least 1 lowercase letter</div>
          <div class="criteria" id="numberCriteria"><span>❌</span> At least 1 number</div>
          <div class="criteria" id="specialCriteria"><span>❌</span> At least 1 special character</div>
        </div>
        <div id="passwordStrength"></div>

        <label for="confirm-password">Confirm Password</label>
        <div class="password-toggle">
          <input type="password" id="confirm-password" placeholder="Re-enter password" required />
          <span class="toggle-eye" onclick="toggleVisibility('confirm-password', this)">Show</span>
        </div>
        <div id="confirmPasswordError">❌ Passwords do not match.</div>

        <button type="submit" class="submit-btn">Create Account</button>
      </form>

      <div class="success-message" id="successMessage">
        <strong>✅ Success!</strong> Your account has been created. Redirecting to login in <span id="redirectTimer">3</span> seconds...
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById('signupForm');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = document.querySelector('.submit-btn');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const confirmPasswordError = document.getElementById('confirmPasswordError');
    const passwordValidationBox = document.getElementById('passwordValidation');
    const passwordStrengthLabel = document.getElementById('passwordStrength');
    const redirectTimer = document.getElementById('redirectTimer');

    const criteriaElements = {
      length: document.getElementById('lengthCriteria'),
      uppercase: document.getElementById('uppercaseCriteria'),
      lowercase: document.getElementById('lowercaseCriteria'),
      number: document.getElementById('numberCriteria'),
      special: document.getElementById('specialCriteria')
    };

    function checkCriteria(password) {
      return {
        length: password.length >= 8,
        uppercase: /[A-Z]/.test(password),
        lowercase: /[a-z]/.test(password),
        number: /\d/.test(password),
        special: /[\W_]/.test(password)
      };
    }

    function updateUI(criteria) {
      passwordValidationBox.style.display = 'block';
      passwordStrengthLabel.style.display = 'block';

      Object.entries(criteria).forEach(([key, valid]) => {
        const elem = criteriaElements[key];
        elem.classList.toggle('valid', valid);
        elem.classList.toggle('invalid', !valid);
        elem.querySelector('span').textContent = valid ? '✅' : '❌';
      });

      const score = Object.values(criteria).filter(Boolean).length;
      passwordStrengthLabel.textContent =
        score === 5 ? 'Strong password' :
        score >= 3 ? 'Medium strength' : 'Weak password';
      passwordStrengthLabel.className =
        'password-strength ' + (score === 5 ? 'strong' : score >= 3 ? 'medium' : 'weak');
    }

    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      const criteria = checkCriteria(val);
      updateUI(criteria);
      confirmPasswordError.style.display = 'none';
    });

    confirmPasswordInput.addEventListener('input', () => {
      confirmPasswordError.style.display =
        confirmPasswordInput.value !== passwordInput.value ? 'block' : 'none';
    });

    function toggleVisibility(fieldId, toggle) {
      const input = document.getElementById(fieldId);
      if (input.type === "password") {
        input.type = "text";
        toggle.textContent = "Hide";
        toggle.style.color = "#7c3aed";
      } else {
        input.type = "password";
        toggle.textContent = "Show";
        toggle.style.color = "#bbb";
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const name = document.getElementById('name').value.trim();
      const dob = document.getElementById('dob').value;
      const gender = document.querySelector('input[name="gender"]:checked')?.value;
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (password !== confirmPassword) {
        confirmPasswordError.style.display = 'block';
        return;
      }

      const criteria = checkCriteria(password);
      if (!Object.values(criteria).every(Boolean)) {
        passwordValidationBox.style.display = 'block';
        passwordStrengthLabel.style.display = 'block';
        return;
      }

      try {
        submitBtn.disabled = true;
        const res = await fetch('http://127.0.0.1:5000/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, dob, gender, email, password })
        });

        const result = await res.json();
        if (result.success) {
          form.style.display = 'none';
          successMessage.style.display = 'block';
          let counter = 3;
          const timer = setInterval(() => {
            counter--;
            redirectTimer.textContent = counter;
            if (counter === 0) {
              clearInterval(timer);
              window.location.href = 'login.html';
            }
          }, 1000);
        } else {
          alert(result.message || 'Registration failed. Please try again.');
          submitBtn.disabled = false;
        }
      } catch (error) {
        alert('Network error. Please try again later.');
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
