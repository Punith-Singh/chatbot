<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | ChatBot</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e1e2f, #282843);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
      color: #fff;
    }

    .background-blur {
      position: absolute;
      width: 220px;
      height: 220px;
      background: #7f5af0;
      filter: blur(100px);
      z-index: 0;
      top: 15%;
      left: 65%;
      opacity: 0.5;
    }

    .phone-container {
      width: 100%;
      max-width: 500px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 28px;
      padding: 2rem 1.8rem;
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      box-shadow: 0 0 60px rgba(124, 58, 237, 0.4), inset 0 0 10px rgba(255, 255, 255, 0.05);
    }

    .register-card {
      background: rgba(255, 255, 255, 0.07);
      backdrop-filter: blur(18px);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      padding: 1.7rem 1.8rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      animation: fadeIn 1s ease-out forwards;
      transform: translateY(30px);
      opacity: 0;
    }

    @keyframes fadeIn {
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    h2 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    
    .form-group {
        margin-bottom: 1rem;
        text-align: left;
    }

    label {
      display: block;
      margin-bottom: 0.4rem;
      font-weight: 500;
      font-size: 0.9rem;
      color: #ddd;
    }

    input[type="text"],
    input[type="email"],
    input[type="date"],
    .password-wrapper input {
      width: 100%;
      padding: 12px 15px;
      border: none;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      color: #eee;
      font-size: 0.95rem;
      transition: background 0.3s ease;
    }
    
    .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }
    
    .password-wrapper input {
        padding-right: 45px;
    }

    input:focus, .password-wrapper input:focus {
      outline: none;
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 0 2px #fff3;
    }

    input::placeholder { color: #bbb; }
    
    .toggle-eye {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: #bbb;
        cursor: pointer;
        transition: color 0.3s ease;
    }
    .toggle-eye:hover {
        color: #7c3aed;
    }

    .gender-options {
      display: flex;
      justify-content: flex-start;
      gap: 20px;
      margin-bottom: 1.1rem;
    }

    .gender-options label {
      display: flex;
      align-items: center;
      font-size: 0.9rem;
      color: #ddd;
      cursor: pointer;
    }

    .gender-options input[type="radio"] {
      margin-right: 6px;
      accent-color: #7c3aed;
    }

    .submit-btn {
      width: 100%;
      padding: 12px 0;
      background: linear-gradient(145deg, #6d28d9, #7c3aed);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.3);
      transition: all 0.3s ease;
      position: relative;
      margin-top: 1rem;
    }

    .submit-btn:hover:not(:disabled) {
      background: linear-gradient(145deg, #8b5cf6, #7c3aed);
      transform: translateY(-2px);
    }

    .submit-btn:disabled {
      background: #58588e;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
    
    .submit-btn .btn-text { transition: opacity 0.2s ease; }
    .submit-btn.loading .btn-text { opacity: 0; }
    .submit-btn .spinner {
        position: absolute; top: 50%; left: 50%;
        margin-left: -10px; margin-top: -10px;
        width: 20px; height: 20px;
        border: 2px solid rgba(255, 255, 255, 0.5);
        border-top-color: #fff;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        opacity: 0;
        transition: opacity 0.2s ease;
    }
    .submit-btn.loading .spinner { opacity: 1; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* === IMPROVED PASSWORD CRITERIA STYLES === */
    .password-validation {
      display: none;
      background: rgba(255, 255, 255, 0.05);
      padding: 1rem;
      border-radius: 10px;
      margin-top: 0.8rem;
      margin-bottom: 1rem;
      text-align: left;
    }

    .password-validation .criteria {
      display: flex; align-items: center; gap: 10px;
      font-size: 0.85rem; margin-bottom: 8px;
      transition: color 0.3s ease;
    }
    .password-validation .criteria:last-child { margin-bottom: 0; }

    .password-validation .criteria .fa-solid {
      font-size: 1.1em;
      width: 20px;
      text-align: center;
      transition: color 0.3s, transform 0.3s ease-out;
    }

    .password-validation .valid { color: #34d399; }
    .password-validation .valid .fa-solid { 
      color: #34d399; 
      transform: scale(1.1) rotate(360deg);
    }
    .password-validation .invalid { color: #f87171; }
    .password-validation .invalid .fa-solid { color: #f87171; }
    
    #passwordStrength {
      text-align: left; font-weight: 500; font-size: 0.9rem;
      margin-top: -0.5rem; margin-bottom: 1rem;
      transition: color 0.3s ease;
    }
    #passwordStrength.weak { color: #f87171; }
    #passwordStrength.medium { color: #facc15; }
    #passwordStrength.strong { color: #34d399; }

    #confirmPasswordError, #error-message {
      color: #fca5a5; font-size: 0.9rem;
      margin-bottom: 1rem; display: none;
      text-align: left; background: rgba(255, 0, 0, 0.1);
      padding: 0.6rem 1rem; border-radius: 8px;
      border-left: 3px solid #f87171;
    }
    #confirmPasswordError { margin-top: -0.5rem; }

    /* === IMPROVED SUCCESS MESSAGE STYLES === */
    .success-message {
      display: none; /* Changed to flex in JS */
      align-items: center;
      gap: 15px;
      padding: 1rem 1.2rem;
      background: rgba(34, 197, 94, 0.15); /* Glassy green */
      border-radius: 12px;
      color: #bbf7d0;
      font-size: 0.95rem;
      text-align: left;
      box-shadow: 0 0 25px rgba(34, 197, 94, 0.3);
      border: 1px solid rgba(34, 197, 94, 0.3);
      animation: successFadeIn 0.5s ease-out forwards;
    }
    
    @keyframes successFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .success-message .fa-circle-check {
      font-size: 1.8rem;
      color: #34d399;
    }
    
    .success-message strong { color: #fff; font-weight: 600; }
    .success-message .message-text { display: flex; flex-direction: column; }

    @media (max-width: 500px) {
      .phone-container { width: 100%; padding: 1.5rem 1rem; border-radius: 20px; }
    }
  </style>
</head>
<body>
  <div class="background-blur"></div>
  <div class="phone-container">
    <div class="register-card">
      <h2>Create Your Account</h2>
      <form id="signupForm" novalidate>
        <div id="error-message"></div>
        
        <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="John Doe" required />
        </div>

        <div class="form-group">
            <label for="dob">Date of Birth</label>
            <input type="date" id="dob" required />
        </div>

        <div class="form-group">
            <label>Gender</label>
            <div class="gender-options">
              <label><input type="radio" name="gender" value="Male" required /> Male</label>
              <label><input type="radio" name="gender" value="Female" /> Female</label>
              <label><input type="radio" name="gender" value="Other" /> Other</label>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="example@gmail.com" required />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrapper">
              <input type="password" id="password" placeholder="Enter password" required autocomplete="new-password" />
              <i class="fa-solid fa-eye toggle-eye" data-target="password"></i>
            </div>
            <div class="password-validation" id="passwordValidation">
              <div class="criteria invalid" id="lengthCriteria"><i class="fa-solid fa-circle-xmark"></i> Minimum 8 characters</div>
              <div class="criteria invalid" id="uppercaseCriteria"><i class="fa-solid fa-circle-xmark"></i> At least 1 uppercase letter</div>
              <div class="criteria invalid" id="lowercaseCriteria"><i class="fa-solid fa-circle-xmark"></i> At least 1 lowercase letter</div>
              <div class="criteria invalid" id="numberCriteria"><i class="fa-solid fa-circle-xmark"></i> At least 1 number</div>
              <div class="criteria invalid" id="specialCriteria"><i class="fa-solid fa-circle-xmark"></i> At least 1 special character</div>
            </div>
            <div id="passwordStrength"></div>
        </div>

        <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <div class="password-wrapper">
              <input type="password" id="confirm-password" placeholder="Re-enter password" required />
              <i class="fa-solid fa-eye toggle-eye" data-target="confirm-password"></i>
            </div>
            <div id="confirmPasswordError">Passwords do not match.</div>
        </div>

        <button type="submit" class="submit-btn" id="submit-btn">
            <span class="btn-text">Create Account</span>
            <div class="spinner"></div>
        </button>
      </form>

      <div class="success-message" id="successMessage">
        <i class="fa-solid fa-circle-check"></i>
        <div class="message-text">
            <strong>Success! Your account has been created.</strong>
            <span>Redirecting to login in <span id="redirectTimer">3</span>s...</span>
        </div>
      </div>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const form = document.getElementById('signupForm');
    const successMessage = document.getElementById('successMessage');
    const submitBtn = document.getElementById('submit-btn');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const confirmPasswordError = document.getElementById('confirmPasswordError');
    const passwordValidationBox = document.getElementById('passwordValidation');
    const passwordStrengthLabel = document.getElementById('passwordStrength');
    const redirectTimer = document.getElementById('redirectTimer');
    const errorMessageDiv = document.getElementById('error-message');

    const criteriaElements = {
      length: document.getElementById('lengthCriteria'),
      uppercase: document.getElementById('uppercaseCriteria'),
      lowercase: document.getElementById('lowercaseCriteria'),
      number: document.getElementById('numberCriteria'),
      special: document.getElementById('specialCriteria')
    };

    const checkCriteria = (password) => ({
      length: password.length >= 8,
      uppercase: /[A-Z]/.test(password),
      lowercase: /[a-z]/.test(password),
      number: /\d/.test(password),
      special: /[\W_]/.test(password)
    });

    const updateValidationUI = (criteria) => {
      let score = 0;
      Object.entries(criteria).forEach(([key, valid]) => {
        const elem = criteriaElements[key];
        const icon = elem.querySelector('i');
        
        // Only change classes if the state is different to prevent re-triggering animations
        if (elem.classList.contains('valid') !== valid) {
            elem.classList.toggle('valid', valid);
            elem.classList.toggle('invalid', !valid);
            icon.classList.toggle('fa-circle-check', valid);
            icon.classList.toggle('fa-circle-xmark', !valid);
        }
        if (valid) score++;
      });
      
      passwordStrengthLabel.style.display = passwordInput.value ? 'block' : 'none';
      if (score === 5) {
        passwordStrengthLabel.textContent = 'Strong password';
        passwordStrengthLabel.className = 'strong';
      } else if (score >= 3) {
        passwordStrengthLabel.textContent = 'Medium strength';
        passwordStrengthLabel.className = 'medium';
      } else {
        passwordStrengthLabel.textContent = 'Weak password';
        passwordStrengthLabel.className = 'weak';
      }
    };

    passwordInput.addEventListener('focus', () => {
        passwordValidationBox.style.display = 'block';
    });

    passwordInput.addEventListener('input', () => {
      const criteria = checkCriteria(passwordInput.value);
      updateValidationUI(criteria);
      if (confirmPasswordInput.value) {
          confirmPasswordError.style.display = confirmPasswordInput.value !== passwordInput.value ? 'block' : 'none';
      }
    });

    confirmPasswordInput.addEventListener('input', () => {
      confirmPasswordError.style.display = confirmPasswordInput.value !== passwordInput.value ? 'block' : 'none';
    });

    document.querySelectorAll('.toggle-eye').forEach(toggle => {
      toggle.addEventListener('click', () => {
        const targetId = toggle.getAttribute('data-target');
        const input = document.getElementById(targetId);
        const isPassword = input.type === 'password';
        input.type = isPassword ? 'text' : 'password';
        toggle.classList.toggle('fa-eye-slash', isPassword);
        toggle.classList.toggle('fa-eye', !isPassword);
      });
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessageDiv.style.display = 'none';
      confirmPasswordError.style.display = 'none';

      const name = document.getElementById('name').value.trim();
      const dob = document.getElementById('dob').value;
      const gender = document.querySelector('input[name="gender"]:checked')?.value;
      const email = document.getElementById('email').value.trim();
      const password = passwordInput.value;
      const confirmPassword = confirmPasswordInput.value;

      if (!name || !dob || !gender || !email || !password || !confirmPassword) {
          showError("Please fill out all fields.");
          return;
      }

      if (password !== confirmPassword) {
        confirmPasswordError.style.display = 'block';
        return;
      }

      const criteria = checkCriteria(password);
      if (!Object.values(criteria).every(Boolean)) {
        showError("Please ensure your password meets all criteria.");
        return;
      }

      setLoading(true);

      // Note: The loading spinner will only be visible if there's a delay in the network response.
      // If your local server at http://127.0.0.1:5000 responds instantly or fails immediately, 
      // you might not see the spinner. This is expected behavior.
      try {
        const res = await fetch('http://127.0.0.1:5000/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, dob, gender, email, password })
        });

        const result = await res.json();
        if (res.ok) {
 {
          form.style.display = 'none';
          successMessage.style.display = 'flex'; // Changed from block to flex
          let counter = 3;
          const timer = setInterval(() => {
            counter--;
            redirectTimer.textContent = counter;
            if (counter === 0) {
              clearInterval(timer);
              window.location.href = 'login.html'; // Uncomment to enable redirect
            }
          }, 1000);
        } else {
          showError(result.message || 'Registration failed. Please try again.');
          setLoading(false);
        }
      } catch (error) {
        showError('Network error. Please ensure your local server is running.');
        setLoading(false);
      }
    });

    function showError(message) {
        errorMessageDiv.textContent = message;
        errorMessageDiv.style.display = 'block';
    }

    function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        submitBtn.classList.toggle('loading', isLoading);
    }
});
</script>
</body>
</html>
